<section class="grid two equal-cards" style="margin-top: 1rem" id="azm-rhr-row" data-m-panel="trends">
        <article class="card card-fill" id="azm-trend-card" data-m-panel="trends" aria-label="Active Zone Minutes last 90 days">
          <h2>Active Zone Minutes · 90d</h2>
          <div class="azm-week-row">
            <div class="chart-summary-chip" id="azm-week-chip">
              <span class="chip-k">7d rolling avg</span>
              <span class="chip-v" id="azm-week-value">—</span>
              <span class="chip-s" id="azm-week-sub">90d</span>
            </div>
            <div class="chart-summary-chip" id="azm-target-chip">
              <span class="chip-k">Target</span>
              <span class="chip-v" id="azm-target-value">—</span>
              <span class="chip-s" id="azm-target-sub">14d median</span>
            </div>
            <ul class="azm-legend" id="azm-legend" aria-label="AZM chart color key">
              <li><span class="azm-swatch azm-swatch-daily" aria-hidden="true"></span> Daily</li>
              <li><span class="azm-swatch azm-swatch-roll" aria-hidden="true"></span> 7d rolling avg</li>
              <li><span class="azm-swatch azm-swatch-trend" aria-hidden="true"></span> Trendline</li>
              <li><span class="azm-swatch azm-swatch-target" aria-hidden="true"></span> Target</li>
            </ul>
          </div>
          <div class="chart-box azm-spark" id="azm-sparkline"></div>
          <p class="muted" id="azm-trend-note" style="margin-top: 0.5rem; font-size: 0.85rem"></p>
        </article>
        <article class="card card-fill" id="rhr-trend-card" data-m-panel="trends" aria-label="Resting heart rate trend">
          <h2>Resting HR (bpm) · 90d</h2>
          <div class="chart-box"><canvas id="chart-rhr" aria-label="Resting heart rate chart last 90 days"></canvas></div>
          <p class="muted" id="rhr-trend-note" style="margin-top: 0.5rem; font-size: 0.85rem"></p>
        </article>
      </section>
