<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Auto Fleet</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚗</text></svg>" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚗</text></svg>" />
  <style>
    :root {
      --bg: #0b0f14;
      --panel: #121a22;
      --border: #1e2a36;
      --text: #e7eef5;
      --muted: #8aa0b5;
      --green: #3dd68c;
      --yellow: #f5c542;
      --red: #ff6b6b;
      --accent: #5b9fd4;
      --chip: #152033;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: radial-gradient(1200px 600px at 10% -10%, #152033 0%, var(--bg) 55%);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.45;
    }
    header {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      background: rgba(11,15,20,0.92);
      backdrop-filter: blur(8px);
      z-index: 20;
    }
    header h1 { margin: 0; font-size: 1.2rem; font-weight: 650; letter-spacing: -0.02em; }
    header .sub { color: var(--muted); font-size: 0.85rem; }
    button, .touch {
      font: inherit;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      padding: 0.45rem 0.9rem;
      font-weight: 600;
      cursor: pointer;
      min-height: 44px;
      min-width: 44px;
    }
    button:hover { border-color: var(--accent); color: var(--accent); }
    main { max-width: 1180px; margin: 0 auto; padding: 1rem 1.15rem 3rem; }
    .meta {
      color: var(--muted);
      font-size: 0.85rem;
      margin: 0 0 0.75rem;
    }
    .glance {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0.55rem;
      margin: 0 0 1rem;
    }
    .glance-cell {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 0.15rem;
      min-height: 88px;
      padding: 0.65rem 0.75rem;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: inherit;
      text-decoration: none;
      min-width: 44px;
    }
    .glance-cell:hover { border-color: var(--accent); }
    .glance-cell.stale { border-color: #6a5a2a; }
    .glance-cell.dead, .card.dead {
      border-color: #8a2a2a;
      box-shadow: inset 3px 0 0 var(--red);
    }
    .glance-top {
      display: flex;
      justify-content: space-between;
      gap: 0.4rem;
      align-items: baseline;
    }
    .glance-name { font-weight: 700; font-size: 0.95rem; }
    .glance-hero { font-size: 1.35rem; font-weight: 700; letter-spacing: -0.03em; }
    .glance-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.25rem;
      color: var(--muted);
      font-size: 0.75rem;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.85rem;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0;
      min-width: 0;
      overflow: hidden;
    }
    .hero {
      display: grid;
      grid-template-columns: 132px 1fr;
      min-height: 110px;
    }
    .hero img {
      width: 100%;
      height: 110px;
      object-fit: cover;
      display: block;
      background: #0a1016;
    }
    .hero-text { padding: 0.75rem 0.95rem 0.55rem; min-width: 0; }
    .card h2 {
      margin: 0 0 0.3rem;
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }
    .chips { display: flex; flex-wrap: wrap; gap: 0.3rem; margin: 0; }
    .chip {
      font-size: 0.72rem;
      font-weight: 650;
      padding: 0.2rem 0.5rem;
      border-radius: 999px;
      border: 1px solid #3a4a6a;
      color: var(--accent);
      background: var(--chip);
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .chip.warn { color: var(--yellow); border-color: #6a5a2a; }
    .chip.ok { color: var(--green); border-color: #2a5a40; }
    .chip.err { color: var(--red); border-color: #6a2a2a; }
    .body { padding: 0 0.95rem 0.85rem; }
    .strip {
      border-top: 1px solid var(--border);
      padding: 0.55rem 0 0.15rem;
      margin-top: 0.35rem;
    }
    .strip h3 {
      margin: 0 0 0.3rem;
      font-size: 0.72rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      font-weight: 650;
    }
    .metrics {
      display: grid;
      grid-template-columns: minmax(5.6rem, auto) minmax(0, 1fr);
      column-gap: 0.7rem;
      row-gap: 0.22rem;
      align-items: baseline;
    }
    .metrics .k {
      color: var(--muted);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      font-weight: 650;
    }
    .metrics .v { font-size: 0.92rem; min-width: 0; }
    .row { font-size: 0.88rem; margin: 0.15rem 0; }
    .muted { color: var(--muted); }
    .empty { color: var(--muted); font-size: 0.86rem; font-style: italic; }
    .err { color: var(--red); }
    .due-lead { color: var(--yellow); font-weight: 650; }
    .soc {
      height: 10px;
      border-radius: 999px;
      background: #1a2733;
      overflow: hidden;
      margin: 0.25rem 0 0.35rem;
    }
    .soc > span { display: block; height: 100%; background: var(--green); }
    .soc.warn > span { background: var(--yellow); }
    .soc.err > span { background: var(--red); }
    a.maps {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      color: var(--accent);
      font-weight: 650;
      text-decoration: none;
    }
    a.maps:hover { text-decoration: underline; }
    .shared { margin-top: 0.9rem; padding: 0.95rem 1rem; }
    .shared ul { margin: 0.3rem 0 0; padding-left: 1.1rem; }
    .turo-inbox {
      margin-top: 0.9rem;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.2rem 0.85rem;
      background: var(--panel);
    }
    .turo-inbox summary {
      cursor: pointer;
      min-height: 44px;
      display: flex;
      align-items: center;
      font-weight: 650;
      color: var(--muted);
    }
    .host-ops {
      margin: 0 0 1rem;
      padding: 0.75rem 0.95rem 0.65rem;
    }
    .host-ops h2 {
      margin: 0 0 0.45rem;
      font-size: 0.78rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      font-weight: 650;
    }
    .host-ops-item {
      display: flex;
      align-items: flex-start;
      gap: 0.65rem;
      margin: 0.2rem 0;
      min-height: 44px;
    }
    .host-ops-item input[type="checkbox"] {
      width: 22px;
      height: 22px;
      margin-top: 0.35rem;
      flex: 0 0 auto;
      accent-color: var(--green);
      cursor: pointer;
    }
    .host-ops-copy { min-width: 0; padding-top: 0.2rem; }
    .host-ops-copy .title { font-weight: 650; }
    .host-ops-copy .notes {
      color: var(--muted);
      font-size: 0.82rem;
      white-space: pre-wrap;
      margin: 0.15rem 0 0;
    }
    @media (max-width: 720px) {
      .glance { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .grid { grid-template-columns: 1fr; }
      .hero { grid-template-columns: 108px 1fr; }
      header { padding: 0.85rem 0.9rem; }
      main { padding: 0.85rem 0.9rem 2.5rem; }
    }
    @media (max-width: 390px) {
      .glance { grid-template-columns: 1fr 1fr; }
      .metrics { grid-template-columns: minmax(5.6rem, auto) minmax(0, 1fr); }
      .hero { grid-template-columns: 96px 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Auto Fleet</h1>
      <div class="sub">Internal ops · five owned units</div>
    </div>
    <button type="button" id="btn-refresh">Refresh</button>
  </header>
  <main>
    <p class="meta" id="status">Loading…</p>
    <section class="card host-ops" id="host-ops" hidden></section>
    <div class="glance" id="glance"></div>
    <div class="grid" id="cards"></div>
    <section class="card shared" id="shared" hidden></section>
    <details class="turo-inbox" id="turo-inbox" hidden>
      <summary>Turo inbox</summary>
      <p class="muted" id="turo-inbox-body"></p>
    </details>
  </main>
  <script>
    const $ = (id) => document.getElementById(id);
    const KM_PER_MILE = 1.609344;

    function money(n) {
      if (n === null || n === undefined || n === "") return "—";
      const v = Number(n);
      if (Number.isNaN(v)) return "—";
      return v.toLocaleString("en-US", { style: "currency", currency: "USD" });
    }

    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }

    function vinShort(vin) {
      if (!vin) return "VIN unknown";
      return "…" + String(vin).slice(-6);
    }

    function chip(text, kind) {
      return `<span class="chip ${kind || ""}">${esc(text)}</span>`;
    }

    function kmToMiles(km) {
      const n = Number(km);
      if (!Number.isFinite(n)) return null;
      return n / KM_PER_MILE;
    }

    function formatOdoMi(km) {
      const mi = kmToMiles(km);
      if (mi == null) return null;
      return Math.round(mi);
    }

    function formatRangeMi(km) {
      const mi = kmToMiles(km);
      if (mi == null) return null;
      return Math.round(mi * 10) / 10;
    }

    function formatSoc(soc) {
      const n = Number(soc);
      if (!Number.isFinite(n)) return null;
      return Math.round(n);
    }

    function rangeLabel(mi) {
      if (mi == null) return null;
      return Number.isInteger(mi) ? String(mi) : mi.toFixed(1);
    }

    function parseTs(value) {
      if (!value) return null;
      const d = new Date(value);
      return Number.isNaN(d.getTime()) ? null : d;
    }

    function relativeAge(ts, now) {
      const dt = parseTs(ts);
      if (!dt) return null;
      const seconds = Math.max(0, ((now || Date.now()) - dt.getTime()) / 1000);
      if (seconds < 45) return "just now";
      if (seconds < 3600) return `${Math.max(1, Math.floor(seconds / 60))}m ago`;
      if (seconds < 86400) return `${Math.max(1, Math.floor(seconds / 3600))}h ago`;
      return `${Math.max(1, Math.floor(seconds / 86400))}d ago`;
    }

    function freshness(ts, nowMs) {
      const dt = parseTs(ts);
      if (!dt) return "unknown";
      const seconds = ((nowMs || Date.now()) - dt.getTime()) / 1000;
      if (seconds > 7 * 86400) return "dead";
      if (seconds > 86400) return "stale";
      return "live";
    }

    function portalOf(f) {
      return (f && (f.portal || f.portal_override)) || null;
    }

    function hasDue(portal) {
      if (!portal) return false;
      const ptp = portal.promise_to_pay || portal.ptp;
      if (ptp && (ptp.amount != null || ptp.due)) return true;
      return portal.amount_due != null || portal.past_due != null;
    }

    function turoOneLine(t, pollS) {
      const bookings = t.bookings || [];
      const mins = Math.round((pollS || 900) / 60);
      if (!bookings.length) return `0 trips · watching ${mins}m`;
      const first = [...bookings].sort((a, b) => String(a.start || "").localeCompare(String(b.start || "")))[0];
      return `${first.status || "booked"} · ${first.guest || "guest"} · ${first.start || "?"} → ${first.end || "?"}`;
    }

    function mapsUrl(loc) {
      if (!loc) return null;
      const lat = loc.lat ?? loc.latitude;
      const lon = loc.lon ?? loc.longitude;
      if (lat == null || lon == null) return null;
      return `https://maps.google.com/?q=${lat},${lon}`;
    }

    function unitPhoto(id) {
      if (id === "m3-2020") return "/static/fleet/tesla-model-3-2020.jpg";
      if (id === "r1s-2023") return "/static/fleet/rivian-r1s-2023.jpg";
      if (id === "m3-2022") return "/static/fleet/tesla-model-3-2022.jpg";
      if (id === "corolla-2022") return "/static/fleet/toyota-corolla-2022.jpg";
      if (id === "corolla-2024") return "/static/fleet/toyota-corolla-2024.jpg";
      return null;
    }

    function glanceOf(u, nowMs, pollS) {
      if (u.glance && u.glance.year_model) return u.glance;
      const idn = u.identity || {};
      const d = u.dimo || {};
      const soc = formatSoc(d.soc);
      const odo = formatOdoMi(d.odometer);
      return {
        year_model: [idn.year, idn.model].filter(Boolean).join(" "),
        title: [idn.year, idn.make, idn.model].filter(Boolean).join(" ") || u.id,
        role: idn.role || "unknown",
        vin_short: idn.vin ? "…" + String(idn.vin).slice(-6) : null,
        last_seen_relative: relativeAge(d.last_seen, nowMs),
        freshness: freshness(d.last_seen, nowMs),
        soc,
        range_mi: formatRangeMi(d.range),
        odo_mi: odo,
        hero: soc != null ? `${soc}%` : (odo != null ? `${odo.toLocaleString("en-US")} mi` : "—"),
        available: !((u.turo || {}).bookings || []).length,
        turo_line: turoOneLine(u.turo || {}, pollS),
        due: hasDue(portalOf(u.finance || {})),
        photo: unitPhoto(u.id),
        maps_url: mapsUrl(d.location),
        show_soc: soc != null,
      };
    }

    function dimoStrip(d, g) {
      const st = d.status || "unconfigured";
      const kind = st === "ok" ? "ok" : st === "error" ? "err" : "warn";
      let body = "";
      if (st === "unconfigured") {
        body = `<div class="empty">DIMO unconfigured — no ~/.config/auto-fleet/env (or no vehicle token). Stub, not live telemetry.</div>`;
      } else if (st === "error") {
        body = `<div class="err">${esc(d.error || "DIMO error")}</div>`;
      } else {
        const rows = [];
        if (g.show_soc && g.soc != null) {
          const barKind = g.freshness === "dead" || g.soc < 25 ? "err" : (g.soc < 50 ? "warn" : "ok");
          rows.push(`<div class="k">SoC</div><div class="v">${g.soc}%<div class="soc ${barKind}" data-soc="${g.soc}"><span style="width:${g.soc}%"></span></div></div>`);
          if (g.range_mi != null) {
            rows.push(`<div class="k">Range</div><div class="v">${esc(rangeLabel(g.range_mi))} mi</div>`);
          }
        }
        if (g.odo_mi != null && !g.show_soc) {
          rows.push(`<div class="k">Odo</div><div class="v">${Number(g.odo_mi).toLocaleString("en-US")} mi</div>`);
        }
        if (g.show_soc && g.odo_mi != null) {
          rows.push(`<div class="k">Odo</div><div class="v">${Number(g.odo_mi).toLocaleString("en-US")} mi</div>`);
        }
        rows.push(`<div class="k">Last seen</div><div class="v ${g.freshness === "dead" ? "err" : "muted"}">${esc(g.last_seen_relative || "—")}${g.freshness === "dead" || g.freshness === "stale" ? ` · ${esc(g.freshness)}` : ""}</div>`);
        if (g.maps_url) {
          rows.push(`<div class="k">Location</div><div class="v"><a class="maps" href="${esc(g.maps_url)}" target="_blank" rel="noopener">Map</a></div>`);
        }
        body = `<div class="metrics">${rows.join("")}</div>`;
      }
      return `<div class="strip"><h3>DIMO ${chip(st, kind)}</h3>${body}</div>`;
    }

    function turoStrip(t, g) {
      const line = (g && g.turo_line) || turoOneLine(t || {}, 900);
      return `<div class="strip"><h3>Turo</h3><div class="row">${esc(line)}</div></div>`;
    }

    function costsStrip(f) {
      const stale = f.stale ? chip("stale", "warn") : chip("sheet", "ok");
      const portal = portalOf(f);
      const ptp = portal && (portal.promise_to_pay || portal.ptp);
      const lines = (f.sheet_lines || []).map((l) =>
        `<div class="row">${esc(l.item)} · ${money(l.monthly)}` +
        `${l.from ? ` <span class="muted">from ${esc(l.from)}</span>` : ""}` +
        `${l.date ? ` <span class="muted">due ${esc(l.date)}</span>` : ""}</div>`
      ).join("");
      let lead = "";
      if (ptp) {
        lead += `<div class="row due-lead">PTP ${money(ptp.amount)} due ${esc(ptp.due || "—")}${ptp.installment ? ` · ${esc(ptp.installment)}` : ""}</div>`;
      }
      if (portal && portal.amount_due != null) {
        lead += `<div class="row">Amount due ${money(portal.amount_due)}</div>`;
      }
      if (portal && portal.past_due != null) {
        lead += `<div class="row err">Past due ${money(portal.past_due)}</div>`;
      }
      let portalHtml = "";
      if (portal) {
        const bits = [];
        if (portal.contractual_monthly != null) bits.push(`${money(portal.contractual_monthly)}/mo`);
        if (portal.apr_pct != null) bits.push(`${portal.apr_pct}% APR`);
        if (portal.principal_balance != null) bits.push(`principal ${money(portal.principal_balance)} (not payoff)`);
        if (portal.payoff_quote && portal.payoff_quote.amount != null) {
          bits.push(`portal payoff quote ${money(portal.payoff_quote.amount)} as of ${esc(portal.payoff_quote.as_of || portal.as_of)} — not live`);
        }
        if (bits.length) {
          portalHtml = `<div class="row muted">Portal ${esc(portal.as_of || "")} · ${esc(bits.join(" · "))} ${chip("stale", "warn")}</div>`;
        }
      }
      const emptyNote = (!lines && !portal)
        ? `<div class="empty">${esc(f.note || "No Fleet-tab lines for this unit.")}</div>`
        : "";
      return `
        <div class="strip">
          <h3>Notes & costs ${stale}</h3>
          ${lead}
          ${lines}
          ${f.sheet_monthly != null ? `<div class="row">Sheet monthly ${money(f.sheet_monthly)}</div>` : ""}
          ${portalHtml}
          ${emptyNote}
        </div>`;
    }

    function glanceStrip(units, nowMs, pollS) {
      return (units || []).map((u) => renderGlanceCell(u, glanceOf(u, nowMs, pollS))).join("");
    }

    function renderGlanceCell(u, g) {
      const freshKind = g.freshness === "dead" ? "err" : (g.freshness === "stale" ? "warn" : "");
      return `
        <a class="glance-cell ${esc(g.freshness || "")}" href="#unit-${esc(u.id)}">
          <div class="glance-top">
            <span class="glance-name">${esc(g.year_model || u.id)}</span>
            ${chip(g.role || "unknown")}
          </div>
          <div class="glance-hero">${esc(g.hero || "—")}</div>
          <div class="glance-meta">
            ${g.last_seen_relative ? `<span class="${freshKind}">${esc(g.last_seen_relative)}</span>` : "<span>—</span>"}
            ${g.freshness === "stale" || g.freshness === "dead" ? chip(g.freshness, g.freshness === "dead" ? "err" : "warn") : ""}
            ${g.available ? chip("available", "ok") : chip("booked", "warn")}
            ${g.due ? chip("due", "err") : ""}
          </div>
        </a>`;
    }

    function renderUnit(u, nowMs, pollS) {
      const idn = u.identity || {};
      const g = glanceOf(u, nowMs, pollS);
      const title = g.title || [idn.year, idn.make, idn.model].filter(Boolean).join(" ") || u.id;
      const photo = g.photo || unitPhoto(u.id);
      const fresh = g.freshness || "unknown";
      const chips = [
        chip(idn.role || "unknown"),
        chip(g.vin_short || vinShort(idn.vin)),
        idn.lender ? chip(idn.lender) : "",
        fresh === "dead" ? chip("dead", "err") : (fresh === "stale" ? chip("stale", "warn") : ""),
        g.due ? chip("due", "err") : "",
      ].join("");
      return `
        <article class="card ${esc(fresh)}" id="unit-${esc(u.id)}" data-unit="${esc(u.id)}" data-freshness="${esc(fresh)}">
          <div class="hero">
            ${photo ? `<img src="${esc(photo)}" alt="${esc(title)}" />` : "<div></div>"}
            <div class="hero-text">
              <h2>${esc(title)}</h2>
              <div class="chips">${chips}</div>
            </div>
          </div>
          <div class="body">
            ${dimoStrip(u.dimo || {}, g)}
            ${turoStrip(u.turo || {}, g)}
            ${costsStrip(u.finance || {})}
          </div>
        </article>`;
    }

    function renderShared(payload) {
      const box = $("shared");
      const sf = payload.shared_finance || {};
      const lines = sf.lines || [];
      const unmatched = payload.turo_unmatched || [];
      if (!lines.length && !unmatched.length) {
        box.hidden = true;
        return;
      }
      box.hidden = false;
      let html = `<div class="hero-text"><h2>Shared / unassigned</h2></div><div class="body">`;
      if (lines.length) {
        html += `<div class="strip"><h3>Fleet-tab lines not pinned to a roster unit</h3><ul>`;
        html += lines.map((l) =>
          `<li>${esc(l.item)} · ${money(l.monthly)} <span class="muted">${esc(l.reason || "")}</span></li>`
        ).join("");
        html += `</ul></div>`;
      }
      if (unmatched.length) {
        html += `<div class="strip"><h3>Turo events not matched to a VIN/unit</h3><ul>`;
        html += unmatched.map((b) =>
          `<li>${esc(b.status)} · ${esc(b.vehicle || "vehicle ?")} · ${esc(b.subject || "")}</li>`
        ).join("");
        html += `</ul></div>`;
      }
      html += `</div>`;
      box.innerHTML = html;
    }

    function renderHostOps(data) {
      const box = $("host-ops");
      if (!box) return;
      if (!data || !data.ok) {
        const err = data && data.error;
        if (!err) {
          box.hidden = true;
          box.innerHTML = "";
          return;
        }
        box.hidden = false;
        box.innerHTML =
          `<h2>Invoice-ready</h2><p class="err">${esc(err)}</p>`;
        return;
      }
      const items = (data.items || []).filter((it) => it && (it.title || it.notes));
      if (!items.length) {
        box.hidden = true;
        box.innerHTML = "";
        return;
      }
      const listId = data.list_id || "";
      const rows = items.map((it) => {
        const tid = esc(it.id || "");
        const lid = esc(it.list_id || listId);
        const notes = (it.notes || "").trim();
        return `<label class="host-ops-item">
          <input type="checkbox" data-task-id="${tid}" data-list-id="${lid}" />
          <span class="host-ops-copy">
            <span class="title">${esc(it.title || "")}</span>
            ${notes ? `<p class="notes">${esc(notes)}</p>` : ""}
          </span>
        </label>`;
      }).join("");
      box.hidden = false;
      box.innerHTML = `<h2>Invoice-ready</h2>${rows}`;
      box.querySelectorAll('input[type="checkbox"]').forEach((el) => {
        el.addEventListener("change", onHostOpsComplete);
      });
    }

    async function onHostOpsComplete(ev) {
      const el = ev.target;
      if (!el || !el.checked) return;
      const taskId = el.getAttribute("data-task-id") || "";
      const listId = el.getAttribute("data-list-id") || "";
      el.disabled = true;
      try {
        const res = await fetch("/api/turo-tasks/complete", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ task_id: taskId, list_id: listId }),
        });
        const data = await res.json();
        if (!data || !data.ok) {
          el.checked = false;
          el.disabled = false;
          const box = $("host-ops");
          const err = (data && data.error) || "Could not complete Google Task";
          let note = box.querySelector(".host-ops-err");
          if (!note) {
            note = document.createElement("p");
            note.className = "err host-ops-err";
            box.appendChild(note);
          }
          note.textContent = err;
          return;
        }
        const row = el.closest(".host-ops-item");
        if (row) row.remove();
        const left = $("host-ops").querySelectorAll(".host-ops-item");
        if (!left.length) {
          $("host-ops").hidden = true;
          $("host-ops").innerHTML = "";
        }
      } catch (err) {
        el.checked = false;
        el.disabled = false;
      }
    }

    function renderTuroFooter(payload) {
      const box = $("turo-inbox");
      const body = $("turo-inbox-body");
      const status = payload.sources && payload.sources.turo && payload.sources.turo.inbox_status;
      if (!status) {
        box.hidden = true;
        body.textContent = "";
        return;
      }
      box.hidden = false;
      body.textContent = status;
    }

    async function load() {
      const status = $("status");
      try {
        const [healthRes, fleetRes, tasksRes] = await Promise.all([
          fetch("/api/health", { cache: "no-store" }),
          fetch("/api/fleet", { cache: "no-store" }),
          fetch("/api/turo-tasks", { cache: "no-store" }).catch(() => null),
        ]);
        const health = await healthRes.json();
        const fleet = await fleetRes.json();
        let tasks = null;
        try {
          tasks = tasksRes ? await tasksRes.json() : null;
        } catch (_err) {
          tasks = null;
        }
        if (!health.ok) throw new Error(health.error || "health not ok");
        if (!fleet.ok) throw new Error(fleet.error || "fleet payload not ok");
        const dimoSrc = fleet.sources && fleet.sources.dimo;
        const dimoLabel = dimoSrc && dimoSrc.configured ? "configured" : "unconfigured";
        const turoAt = (fleet.sources && fleet.sources.turo && fleet.sources.turo.refreshed_at) || "—";
        const expAt = (fleet.sources && fleet.sources.expenses && fleet.sources.expenses.as_of) || "no snapshot";
        const hasFleet = fleet.sources && fleet.sources.expenses && fleet.sources.expenses.has_fleet_tab;
        const units = fleet.unit_count != null ? fleet.unit_count : (fleet.units || []).length;
        const pollS = (fleet.sources && fleet.sources.turo && fleet.sources.turo.poll_interval_s) || 900;
        const nowMs = Date.parse(fleet.as_of) || Date.now();
        status.textContent =
          `Refreshed ${fleet.as_of || "—"} · ${units} units` +
          ` · DIMO ${dimoLabel}` +
          ` · Turo ${turoAt}` +
          (hasFleet ? ` · costs sheet ${expAt}` : ` · costs stale (${expAt})`);
        const list = fleet.units || [];
        renderHostOps(tasks);
        $("glance").innerHTML = list.map((u) => renderGlanceCell(u, glanceOf(u, nowMs, pollS))).join("");
        $("cards").innerHTML = list.map((u) => renderUnit(u, nowMs, pollS)).join("");
        renderShared(fleet);
        renderTuroFooter(fleet);
      } catch (err) {
        status.innerHTML = `<span class="err">${esc(err.message || err)}</span>`;
      }
    }

    $("btn-refresh").addEventListener("click", load);
    load();
    setInterval(load, 15 * 60 * 1000);
  </script>
</body>
</html>
