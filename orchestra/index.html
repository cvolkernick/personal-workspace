<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Orchestra — now / next / blocked</title>
  <style>
    :root {
      --bg: #080c12;
      --panel: #111820;
      --panel2: #0e141c;
      --border: #1e2a36;
      --text: #e7eef5;
      --muted: #8aa0b5;
      --green: #3dd68c;
      --yellow: #f5c542;
      --red: #ff6b6b;
      --accent: #5b9fd4;
      --cyan: #4fd1c5;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background:
        radial-gradient(900px 500px at 85% -10%, #1a1040 0%, transparent 50%),
        radial-gradient(1000px 500px at 5% 0%, #0d2035 0%, var(--bg) 55%);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.45;
    }
    a.world-strip {
      display: none;
      padding: 0.4rem 1.5rem;
      border-bottom: 1px solid #2a3a55;
      background: linear-gradient(90deg, #101828 0%, #0c141c 70%);
      color: var(--text);
      text-decoration: none;
      font-size: 0.86rem;
      font-weight: 650;
      letter-spacing: 0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    a.world-strip.live { display: block; }
    a.world-strip:hover { color: var(--cyan); }
    a.world-strip .w-kicker {
      color: var(--muted); font-size: 0.68rem; font-weight: 800;
      letter-spacing: 0.08em; text-transform: uppercase; margin-right: 0.55rem;
    }
    header {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex; flex-wrap: wrap; gap: 0.75rem 1.25rem;
      align-items: center; justify-content: space-between;
      background: rgba(8,12,18,0.75);
      backdrop-filter: blur(8px);
      position: sticky; top: 0; z-index: 12;
    }
    header h1 {
      margin: 0; font-size: 1.25rem; font-weight: 700;
      letter-spacing: -0.03em;
    }
    header .sub { color: var(--muted); font-size: 0.85rem; }
    button {
      background: var(--panel); color: var(--text);
      border: 1px solid var(--border); border-radius: 8px;
      padding: 0.45rem 0.9rem; font-size: 0.9rem; cursor: pointer; font-weight: 600;
    }
    button:hover { border-color: var(--accent); color: var(--accent); }
    button.primary { background: #1a3a55; border-color: #2d6a9f; }
    .domain-nav {
      display: flex; flex-wrap: wrap; gap: 0.45rem;
      padding: 0.55rem 1.5rem;
      border-bottom: 1px solid var(--border);
      background: rgba(10,14,20,0.94);
    }
    .nav-chip {
      display: inline-flex; align-items: center; gap: 0.35rem;
      background: var(--panel); color: var(--text);
      border: 1px solid var(--border); border-radius: 999px;
      padding: 0.28rem 0.7rem; font-size: 0.82rem; font-weight: 650;
      text-decoration: none;
    }
    .nav-chip:hover { border-color: var(--accent); color: var(--accent); }
    .nav-chip .dot {
      width: 0.45rem; height: 0.45rem; border-radius: 50%;
      background: var(--muted);
    }
    .nav-chip.live .dot { background: var(--cyan); box-shadow: 0 0 6px var(--cyan); }
    .nav-chip.offline .dot { background: var(--yellow); }
    main { max-width: 720px; margin: 0 auto; padding: 1.25rem 1.5rem 3rem; }
    .error-banner {
      background: #2a1515; border: 1px solid #6b2e2e; color: var(--red);
      padding: 0.75rem 1rem; border-radius: 8px; margin-bottom: 1rem; display: none;
    }
    .error-banner.show { display: block; }
    section { margin-bottom: 1.25rem; }
    section h2 {
      margin: 0 0 0.55rem; font-size: 0.75rem; font-weight: 800;
      letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);
    }
    .seat {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 12px; padding: 0.9rem 1rem;
    }
    .seat.empty { color: var(--muted); }
    .seat.now {
      border-color: #3a5a8a;
      background: linear-gradient(135deg, #152238 0%, var(--panel) 60%);
    }
    .seat.blocked {
      border-color: #6b2e2e;
      background: linear-gradient(135deg, #1a1010 0%, var(--panel) 55%);
    }
    .seat .title { font-weight: 700; font-size: 1.05rem; }
    .seat .detail { color: var(--muted); font-size: 0.88rem; margin-top: 0.25rem; }
    .chk { display: inline-flex; align-items: center; margin-right: 0.45rem; vertical-align: middle; }
    .chk input { width: 1rem; height: 1rem; accent-color: var(--cyan); cursor: pointer; }
    .list { display: flex; flex-direction: column; gap: 0.5rem; }
    .row {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 10px; padding: 0.7rem 0.9rem;
    }
    .row .title { font-weight: 650; }
    .row .detail { color: var(--muted); font-size: 0.85rem; }
    .pill {
      display: inline-flex; font-size: 0.68rem; font-weight: 700;
      letter-spacing: 0.04em; text-transform: uppercase;
      padding: 0.12rem 0.4rem; border-radius: 999px; border: 1px solid currentColor;
      margin-right: 0.35rem;
    }
    .pill.block { color: var(--red); }
    .pill.warn { color: var(--yellow); }
    .pill.unknown { color: #f0a060; }
    .pill.info { color: var(--muted); }
    .one-liners { display: flex; flex-direction: column; gap: 0.3rem; color: var(--muted); font-size: 0.88rem; }
    .one-liners:empty { display: none; }
    a.link { color: var(--accent); text-decoration: none; font-size: 0.85rem; font-weight: 600; }
    a.link:hover { text-decoration: underline; }
    footer {
      color: var(--muted); font-size: 0.8rem; text-align: center;
      padding: 1rem; border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <a class="world-strip" id="world-strip" href="http://127.0.0.1:8795/" target="_blank" rel="noopener" aria-label="WORLD — open Horizon">
    <span class="w-kicker">WORLD</span><span id="world-line"></span>
  </a>
  <header>
    <div>
      <h1>Orchestra</h1>
      <div class="sub" id="purpose">Now · Next · Blocked</div>
    </div>
    <button class="primary" id="btn-refresh" type="button">Refresh</button>
  </header>
  <nav class="domain-nav" id="domain-nav" aria-label="Personal dock — Time Allocator and Workflow"></nav>
  <main>
    <div class="error-banner" id="error"></div>

    <section id="sec-now" aria-label="NOW">
      <h2>Now</h2>
      <div class="seat now empty" id="now-seat">Empty</div>
    </section>

    <section id="sec-next" aria-label="NEXT">
      <h2>Next</h2>
      <div class="list" id="next-list"></div>
    </section>

    <section id="sec-blocked" aria-label="BLOCKED">
      <h2>Blocked</h2>
      <div class="list" id="blocked-list"></div>
    </section>

    <section id="sec-one-liners" aria-label="Optional facts">
      <div class="one-liners" id="one-liners"></div>
    </section>

    <section id="sec-advice" aria-label="ADVICE">
      <h2>Advice</h2>
      <div class="list" id="advice-list"></div>
    </section>
  </main>
  <footer id="footer">Orchestra · :8790</footer>

  <script>
    const $ = (id) => document.getElementById(id);
    const DOCK = [
      { id: "holistic", short: "Time Allocator", port: 8770, path: "/" },
      { id: "workflow", short: "Workflow", port: 8765, path: "/" },
    ];

    function pageHost() {
      return (window.location && window.location.hostname) || "127.0.0.1";
    }

    function publicizeUrl(url) {
      if (!url) return url;
      const host = pageHost();
      if (!host || host === "127.0.0.1" || host === "localhost") return url;
      return String(url)
        .replace(/:\/\/127\.0\.0\.1/g, "://" + host)
        .replace(/:\/\/localhost/g, "://" + host)
        .replace(/:\/\/\[::1\]/g, "://" + host);
    }

    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, (c) => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
      })[c]);
    }

    function showError(msg) {
      const el = $("error");
      if (!msg) { el.classList.remove("show"); el.textContent = ""; return; }
      el.textContent = msg;
      el.classList.add("show");
    }

    function relAge(iso) {
      if (!iso) return "";
      const t = Date.parse(iso);
      if (Number.isNaN(t)) return "";
      const mins = Math.max(0, Math.round((Date.now() - t) / 60000));
      if (mins < 1) return "just now";
      if (mins < 60) return mins + "m ago";
      const hrs = Math.round(mins / 60);
      if (hrs < 48) return hrs + "h ago";
      return Math.round(hrs / 24) + "d ago";
    }

    function renderWorld(pulse) {
      const a = $("world-strip");
      const lineEl = $("world-line");
      const world = (pulse && pulse.world) || {};
      const href = publicizeUrl(world.url || "http://127.0.0.1:8795/");
      if (a) a.href = href;
      const line = world.line || "";
      if (lineEl) lineEl.textContent = line;
      if (a) a.classList.toggle("live", !!(world.live && line));
    }

    function renderDock(data) {
      const el = $("domain-nav");
      if (!el) return;
      const pulseDock = (data.pulse && data.pulse.dock) || [];
      const byId = {};
      (data.domains || []).forEach((d) => { if (d && d.id) byId[d.id] = d; });
      pulseDock.forEach((d) => { if (d && d.id) byId[d.id] = Object.assign({}, byId[d.id] || {}, d); });
      el.innerHTML = DOCK.map((chip) => {
        const d = byId[chip.id] || {};
        let klass = "unknown";
        if (d.live === true) klass = "live";
        else if (d.live === false) klass = "offline";
        const href = publicizeUrl(d.url || ("http://" + pageHost() + ":" + chip.port + (chip.path || "/")));
        return `<a class="nav-chip ${klass}" href="${esc(href)}" data-domain="${esc(chip.id)}"
          target="_blank" rel="noopener">
          <span class="dot" aria-hidden="true"></span>${esc(chip.short)}
        </a>`;
      }).join("");
    }

    async function openDomain(domainId, fallbackUrl) {
      try {
        const res = await fetch("/api/launch", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ domain: domainId }),
          cache: "no-store",
        });
        const body = await res.json().catch(() => ({}));
        if (body && body.url) {
          window.open(publicizeUrl(body.url), "_blank", "noopener");
          return;
        }
      } catch (_) { /* fall through */ }
      if (fallbackUrl) window.open(publicizeUrl(fallbackUrl), "_blank", "noopener");
    }

    function bindDock() {
      const el = $("domain-nav");
      if (!el || el._bound) return;
      el._bound = true;
      el.addEventListener("click", (ev) => {
        const a = ev.target.closest("a.nav-chip[data-domain]");
        if (!a) return;
        if (!a.classList.contains("live")) {
          ev.preventDefault();
          openDomain(a.getAttribute("data-domain"), a.getAttribute("href"));
        }
      });
    }

    function isCheckable(item) {
      return !!(item && item.checkable && item.source_id && (item.list_id || item.list_title));
    }

    function checkboxHtml(item) {
      if (!isCheckable(item)) return "";
      return `<label class="chk"><input type="checkbox" data-complete`
        + ` data-source="${esc(item.source || "google_tasks")}"`
        + ` data-source-id="${esc(item.source_id)}"`
        + ` data-list-id="${esc(item.list_id || "")}"`
        + ` data-list-title="${esc(item.list_title || "")}"`
        + ` aria-label="Complete ${esc(item.title || "item")}"></label>`;
    }

    function itemHtml(item, extraClass, opts) {
      const domain = item.domain || "";
      const sev = item.severity || "";
      const link = item.deep_link
        ? `<a class="link" href="${esc(publicizeUrl(item.deep_link))}" target="_blank" rel="noopener">Open →</a>`
        : "";
      const box = (opts && opts.check) ? checkboxHtml(item) : "";
      return `<div class="row ${extraClass || ""}">
        <div class="title">
          ${box}
          ${sev ? `<span class="pill ${esc(sev)}">${esc(sev)}</span>` : ""}
          ${domain ? `<span class="pill info">${esc(domain)}</span>` : ""}
          ${esc(item.title || "")}
        </div>
        <div class="detail">${esc(item.why || item.detail || "")}</div>
        ${link}
      </div>`;
    }

    function renderNow(pulse) {
      const el = $("now-seat");
      const now = pulse && pulse.now;
      if (!now) {
        el.className = "seat now empty";
        el.textContent = "Empty";
        return;
      }
      el.className = "seat now";
      el.innerHTML = `<div class="title">${checkboxHtml(now)}${esc(now.title || "")}</div>`
        + (now.why ? `<div class="detail">${esc(now.why)}</div>` : "");
    }

    function renderNext(pulse, dayPlan) {
      const el = $("next-list");
      const next = (pulse && pulse.next) || (dayPlan && dayPlan.next3) || [];
      el.innerHTML = next.length
        ? next.map((item) => itemHtml(item, "", { check: true })).join("")
        : '<div class="seat empty">Empty</div>';
    }

    function renderBlocked(pulse) {
      const el = $("blocked-list");
      const blocked = (pulse && pulse.blocked) || {};
      const items = blocked.items || [];
      if (blocked.status === "unknown" || !items.length) {
        el.innerHTML = `<div class="seat empty">${esc(blocked.note || "unknown")}</div>`;
        return;
      }
      el.innerHTML = items.map((item) => itemHtml(item, "blocked")).join("");
    }

    function renderOneLiners(pulse) {
      const el = $("one-liners");
      const lines = (pulse && pulse.one_liners) || [];
      el.innerHTML = lines.map((ln) => `<div>${esc(ln.text || "")}</div>`).join("");
    }

    function renderAdvice(pulse) {
      const el = $("advice-list");
      const advice = (pulse && pulse.advice) || {};
      const items = advice.items || [];
      // COS seat only. Do not read the old hygiene or board streams.
      el.innerHTML = items.length
        ? items.map((item) => itemHtml(item)).join("")
        : "";
    }

    function render(data) {
      showError("");
      const pulse = data.pulse || {};
      $("purpose").textContent = "Now · Next · Blocked";
      renderWorld(pulse);
      renderDock(data);
      bindDock();
      renderNow(pulse);
      renderNext(pulse, data.day_plan);
      renderBlocked(pulse);
      renderOneLiners(pulse);
      renderAdvice(pulse);
      const rel = relAge(data.generated_at);
      $("footer").textContent = `Orchestra · ${rel || data.generated_at || ""} · :8790`;
    }

    async function load() {
      $("btn-refresh").disabled = true;
      try {
        const res = await fetch("/api/orchestra", { cache: "no-store" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || "payload not ok");
        render(data);
      } catch (e) {
        showError("Failed to load orchestra payload: " + e.message);
      } finally {
        $("btn-refresh").disabled = false;
      }
    }

    async function completeFromInput(input) {
      const source = (input.getAttribute("data-source") || "google_tasks").trim();
      const sourceId = (input.getAttribute("data-source-id") || "").trim();
      const listId = (input.getAttribute("data-list-id") || "").trim();
      const listTitle = (input.getAttribute("data-list-title") || "").trim();
      if (!sourceId || (!listId && !listTitle)) {
        input.checked = false;
        return;
      }
      input.disabled = true;
      try {
        const body = { source, source_id: sourceId };
        if (listId) body.list_id = listId;
        if (listTitle) body.list_title = listTitle;
        const res = await fetch("/api/complete", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
          cache: "no-store",
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.ok || !data.accepted) {
          input.checked = false;
          input.disabled = false;
          showError(data.error || "Source did not accept completion");
          return;
        }
        await load();
      } catch (e) {
        input.checked = false;
        input.disabled = false;
        showError("Could not complete item: " + (e && e.message ? e.message : e));
      }
    }

    function bindComplete() {
      const main = document.querySelector("main");
      if (!main || main._completeBound) return;
      main._completeBound = true;
      main.addEventListener("change", (ev) => {
        const input = ev.target.closest && ev.target.closest("input[data-complete]");
        if (!input) return;
        if (!input.closest("#now-seat, #next-list")) {
          input.checked = false;
          return;
        }
        completeFromInput(input);
      });
    }

    $("btn-refresh").addEventListener("click", () => load());
    bindComplete();
    load();
  </script>
</body>
</html>
