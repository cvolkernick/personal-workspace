<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Workflow Management — personal-workspace</title>
  <style>
    :root {
      --bg: #0b0f14;
      --panel: #121a22;
      --border: #1e2a36;
      --text: #e7eef5;
      --muted: #8aa0b5;
      --green: #3dd68c;
      --yellow: #f5c542;
      --red: #ff6b6b;
      --accent: #5b9fd4;
      --blue: #7c9cff;
      --purple: #c084fc;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: radial-gradient(1200px 600px at 10% -10%, #152033 0%, var(--bg) 55%);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.45;
    }
    header {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex; flex-wrap: wrap; gap: 0.75rem 1.25rem;
      align-items: center; justify-content: space-between;
    }
    header h1 { margin: 0; font-size: 1.25rem; font-weight: 650; letter-spacing: -0.02em; }
    header .sub { color: var(--muted); font-size: 0.85rem; }
    header .header-left { display: flex; flex-wrap: wrap; gap: 0.5rem 1rem; align-items: center; }
    header .header-meta { display: flex; flex-wrap: wrap; gap: 0.35rem; align-items: center; }
    .actions { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
    button, label.toggle {
      background: var(--panel); color: var(--text);
      border: 1px solid var(--border); border-radius: 8px;
      padding: 0.45rem 0.9rem; font-size: 0.9rem; cursor: pointer; font-weight: 600;
    }
    button:hover { border-color: var(--accent); color: var(--accent); }
    button:disabled { opacity: 0.5; cursor: wait; }
    a.btn-bl-orch {
      display: inline-flex; align-items: center;
      background: #1a3a55; border: 1px solid #2d6a9f; color: var(--text);
      border-radius: 8px; padding: 0.4rem 0.75rem; font-size: 0.85rem;
      font-weight: 600; text-decoration: none;
    }
    a.btn-bl-orch:hover { border-color: var(--accent); color: var(--accent); }
    .rec-card.orch-focus {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
      box-shadow: 0 0 0 4px rgba(91,159,212,0.15);
    }
    label.toggle { display: inline-flex; gap: 0.4rem; align-items: center; font-weight: 500; color: var(--muted); }
    main { max-width: 1100px; margin: 0 auto; padding: 1.25rem 1.5rem 3rem; }
    .error-banner {
      background: #2a1515; border: 1px solid #6b2e2e; color: var(--red);
      padding: 0.75rem 1rem; border-radius: 8px; margin-bottom: 1rem; display: none;
    }
    .error-banner.show { display: block; }
    .verdict {
      border-radius: 14px; padding: 1.1rem 1.25rem; margin-bottom: 1rem;
      border: 1px solid var(--border); display: grid; gap: 0.5rem;
    }
    .verdict.ready { background: #0f2419; border-color: #245c42; }
    .verdict.caution { background: #2a2410; border-color: #6b5a1e; }
    .verdict.blocked { background: #2a1515; border-color: #6b2e2e; }
    .verdict h2 { margin: 0; font-size: 1.2rem; }
    .verdict .tag {
      display: inline-block; font-size: 0.75rem; font-weight: 700;
      letter-spacing: 0.08em; text-transform: uppercase; padding: 0.2rem 0.55rem;
      border-radius: 999px; border: 1px solid currentColor;
    }
    .verdict.ready .tag { color: var(--green); }
    .verdict.caution .tag { color: var(--yellow); }
    .verdict.blocked .tag { color: var(--red); }
    .summary { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 0.65rem; margin-bottom: 1rem; }
    .stat {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 10px; padding: 0.65rem 0.85rem; min-width: 0;
      cursor: pointer; text-align: left; width: 100%;
      color: inherit; font: inherit;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .stat:hover { border-color: var(--accent); }
    .stat.open { border-color: var(--accent); box-shadow: 0 0 0 1px rgba(91,159,212,0.25); }
    .stat .n { font-size: 1.25rem; font-weight: 700; font-variant-numeric: tabular-nums; }
    .stat .l { color: var(--muted); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em; }
    .stat .stat-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 0.35rem; }
    .stat .chev { color: var(--muted); font-size: 0.75rem; transition: transform 0.15s; }
    .stat.open .chev { transform: rotate(90deg); color: var(--accent); }
    .stat-detail {
      display: none; margin-top: 0.55rem; padding-top: 0.55rem;
      border-top: 1px solid var(--border); text-align: left;
    }
    .stat.open .stat-detail { display: block; }
    .stat-detail .title { font-weight: 650; font-size: 0.88rem; margin-bottom: 0.25rem; }
    .stat-detail .detail { color: var(--muted); font-size: 0.82rem; }
    .stat-detail code {
      display: block; margin-top: 0.35rem; padding: 0.35rem 0.45rem;
      background: #0a1016; border-radius: 6px; border: 1px solid var(--border);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.72rem; color: var(--blue); word-break: break-all;
    }
    .stat.lvl-ok { border-color: #245c42; }
    .stat.lvl-warn { border-color: #6b5a1e; }
    .stat.lvl-info { border-color: #2a4a66; }
    .stat.lvl-blocked { border-color: #6b2e2e; }
    .card {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 12px; padding: 1rem 1.15rem; display: grid; gap: 0.55rem; margin-bottom: 0.85rem;
    }
    .card h2, .card h3 { margin: 0; }
    .card h2 { font-size: 1.05rem; }
    .card h3 { font-size: 0.8rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; }
    .lvl {
      font-size: 0.65rem; font-weight: 700; text-transform: uppercase;
      padding: 0.15rem 0.4rem; border-radius: 6px;
      border: 1px solid var(--border);
    }
    .lvl.ok { color: var(--green); border-color: #245c42; }
    .lvl.warn { color: var(--yellow); border-color: #6b5a1e; }
    .lvl.info { color: var(--accent); border-color: #2a4a66; }
    .lvl.blocked { color: var(--red); border-color: #6b2e2e; }
    .cmd {
      display: block; margin-top: 0.35rem; padding: 0.4rem 0.55rem;
      background: #0a1016; border-radius: 6px; border: 1px solid var(--border);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.78rem; color: var(--blue); word-break: break-all;
    }
    .section-title.compact { margin-top: 0.75rem; }
    .pill {
      display: inline-flex; align-items: center; gap: 0.3rem;
      padding: 0.22rem 0.55rem; border-radius: 999px; font-weight: 600; font-size: 0.72rem;
      border: 1px solid var(--border); background: #0e151c;
    }
    .pill.clean { color: var(--green); border-color: #245c42; }
    .pill.dirty { color: var(--yellow); border-color: #6b5a1e; }
    .pill.branch { color: var(--blue); border-color: #3a4570; }
    .pill.active { color: var(--green); border-color: #245c42; background: #0f2419; }
    .pill.session { color: var(--purple); border-color: #5b3a7a; }
    .pill.muted { color: var(--muted); font-weight: 500; }
    .meta { display: grid; gap: 0.25rem; font-size: 0.9rem; }
    .meta .row { display: grid; grid-template-columns: 5.5rem 1fr; gap: 0.5rem; }
    .meta .label { color: var(--muted); }
    .meta .val { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.82rem; word-break: break-all; }
    .meta a { color: var(--accent); text-decoration: none; }
    .sess {
      display: grid; grid-template-columns: auto 1fr auto; gap: 0.5rem 0.75rem;
      align-items: start; padding: 0.45rem 0.5rem; border-radius: 8px;
      background: #0e151c; font-size: 0.85rem; margin-top: 0.35rem;
    }
    .sess .title { font-weight: 600; }
    .sess .id { color: var(--muted); font-family: ui-monospace, Menlo, monospace; font-size: 0.72rem; }
    .sess .when { color: var(--muted); font-size: 0.78rem; white-space: nowrap; }
    .section-title {
      margin: 1.4rem 0 0.65rem; font-size: 0.85rem; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600;
    }
    .dirty-list { margin: 0.2rem 0 0; padding-left: 1.1rem; color: var(--muted); font-size: 0.8rem;
      font-family: ui-monospace, Menlo, monospace; }
    #strategy-focus .dirty-list { font-family: inherit; color: var(--text); }
    #strategy-focus .dirty-list strong { color: var(--text); font-weight: 650; }
    #strategy-focus .dirty-list em { color: var(--muted); font-style: italic; }
    .copy-btn { font-size: 0.75rem; padding: 0.25rem 0.5rem; margin-left: 0.35rem; }
    .two-col { display: grid; gap: 0.85rem; }
    @media (min-width: 900px) {
      .two-col { grid-template-columns: 1fr 1fr; align-items: start; }
    }
    footer { margin-top: 2rem; color: var(--muted); font-size: 0.8rem; text-align: center; }
    .empty { color: var(--muted); text-align: center; padding: 1.25rem; border: 1px dashed var(--border); border-radius: 12px; }
    /* gitk-style branch graph */
    .graph-wrap {
      overflow: auto; max-height: 28rem; border: 1px solid var(--border);
      border-radius: 10px; background: #0a1016; margin-top: 0.5rem;
    }
    .graph-svg { display: block; min-width: 100%; }
    .graph-row-hit { cursor: default; }
    .graph-row-hit:hover rect.graph-bg { fill: rgba(91,159,212,0.08); }
    .graph-label {
      display: inline-flex; align-items: center; gap: 0.2rem;
      padding: 0.05rem 0.4rem; border-radius: 999px; font-size: 0.65rem;
      font-weight: 700; border: 1px solid; margin-right: 0.25rem;
      font-family: ui-monospace, Menlo, monospace; vertical-align: middle;
    }
    .graph-controls {
      display: flex; flex-wrap: wrap; gap: 0.4rem; align-items: center;
      margin-bottom: 0.45rem;
    }
    .graph-controls button.active {
      border-color: var(--accent); color: var(--accent);
      box-shadow: 0 0 0 1px rgba(91,159,212,0.25);
    }
    .graph-meta { color: var(--muted); font-size: 0.78rem; }
    .graph-meta a { color: var(--accent); text-decoration: none; }
    .branch-list-compact { max-height: 12rem; overflow: auto; }
    /* Recommendation priority + press rank */
    .pill.pri-critical { color: #ff6b6b; border-color: #6b2e2e; background: #2a1515; }
    .pill.pri-high { color: #f5a623; border-color: #6b4a1e; background: #2a1f10; }
    .pill.pri-medium { color: #5b9fd4; border-color: #2a4a66; background: #121c28; }
    .pill.pri-low { color: #8aa0b5; border-color: #2a3540; background: #141a20; }
    .rec-card {
      background: #0e151c;
      border: 1px solid var(--border);
      border-left-width: 4px;
      border-radius: 12px;
      padding: 0.75rem 0.85rem;
      margin-bottom: 0.5rem;
      display: grid;
      gap: 0.35rem;
    }
    .rec-card.pri-critical { border-left-color: #ff6b6b; background: linear-gradient(90deg, #2a1515 0%, #0e151c 28%); }
    .rec-card.pri-high { border-left-color: #f5a623; background: linear-gradient(90deg, #2a1f10 0%, #0e151c 28%); }
    .rec-card.pri-medium { border-left-color: #5b9fd4; background: linear-gradient(90deg, #121c28 0%, #0e151c 28%); }
    .rec-card.pri-low { border-left-color: #3a4550; background: #0e151c; }
    .rec-card.rank-1 { box-shadow: 0 0 0 1px rgba(255,107,107,0.25); }
    .rank-badge {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 2rem; height: 2rem; border-radius: 999px;
      font-weight: 800; font-size: 0.95rem; font-variant-numeric: tabular-nums;
      border: 1px solid var(--border); background: #0a1016;
    }
    .rank-badge.r1 { color: #ff6b6b; border-color: #6b2e2e; background: #2a1515; }
    .rank-badge.r2 { color: #f5a623; border-color: #6b4a1e; background: #2a1f10; }
    .rank-badge.r3 { color: #5b9fd4; border-color: #2a4a66; background: #121c28; }
    .rank-head {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 0.65rem;
      align-items: start;
    }
    .pri-band {
      display: flex; align-items: center; gap: 0.5rem;
      margin: 0.85rem 0 0.4rem;
      padding: 0.35rem 0.55rem;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .pri-band.critical { color: #ff6b6b; background: #2a1515; border: 1px solid #6b2e2e; }
    .pri-band.high { color: #f5a623; background: #2a1f10; border: 1px solid #6b4a1e; }
    .pri-band.medium { color: #5b9fd4; background: #121c28; border: 1px solid #2a4a66; }
    .pri-band.low { color: #8aa0b5; background: #141a20; border: 1px solid #2a3540; }
    .legend-row { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.35rem; }
    .view-toggle { display: flex; gap: 0.35rem; flex-wrap: wrap; }
    .view-toggle button.active { border-color: var(--accent); color: var(--accent); }

    /* —— Tab shell (FitDash/FCC-style) —— */
    body.m-shell { padding-bottom: 4.5rem; }
    .top-tabs {
      display: flex; gap: 0.35rem; flex-wrap: wrap;
      padding: 0.55rem 1.5rem 0.65rem;
      border-bottom: 1px solid var(--border);
      background: rgba(11,15,20,0.92);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      position: sticky; top: 0; z-index: 50;
    }
    .top-tabs .tab-btn {
      display: inline-flex; align-items: center; gap: 0.35rem;
      background: transparent; border: 1px solid transparent;
      color: var(--muted); border-radius: 999px;
      padding: 0.4rem 0.85rem; font-size: 0.85rem; font-weight: 650;
      cursor: pointer;
    }
    .top-tabs .tab-btn:hover { color: var(--text); border-color: var(--border); }
    .top-tabs .tab-btn.active {
      color: var(--text); border-color: var(--accent);
      background: rgba(91,159,212,0.14); box-shadow: 0 0 0 1px rgba(91,159,212,0.2);
    }
    .top-tabs .tab-ico { font-size: 0.95rem; opacity: 0.9; }
    .top-tabs .tab-count {
      font-size: 0.7rem; font-weight: 700; min-width: 1.25rem;
      padding: 0.05rem 0.35rem; border-radius: 999px;
      background: #1a3a55; color: var(--accent); border: 1px solid #2d6a9f;
    }
    .mobile-tabbar {
      display: none;
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 60;
      background: rgba(12,16,22,0.96);
      border-top: 1px solid var(--border);
      padding: 0.35rem 0.4rem calc(0.35rem + env(safe-area-inset-bottom));
      justify-content: space-around; gap: 0.15rem;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .mobile-tabbar .tab-btn {
      flex: 1; display: flex; flex-direction: column; align-items: center; gap: 0.1rem;
      background: transparent; border: none; color: var(--muted);
      padding: 0.35rem 0.2rem; font-size: 0.68rem; font-weight: 650; cursor: pointer;
      border-radius: 10px; min-height: 48px;
    }
    .mobile-tabbar .tab-btn .tab-ico { font-size: 1.15rem; line-height: 1; }
    .mobile-tabbar .tab-btn.active { color: var(--accent); background: rgba(91,159,212,0.12); }
    body.m-shell [data-m-panel] { display: none !important; }
    body.m-shell[data-m-active="status"] [data-m-panel="status"],
    body.m-shell[data-m-active="plan"] [data-m-panel="plan"],
    body.m-shell[data-m-active="tasks"] [data-m-panel="tasks"],
    body.m-shell[data-m-active="repo"] [data-m-panel="repo"] {
      display: block !important;
    }
    @media (max-width: 720px) {
      .top-tabs { display: none; }
      .mobile-tabbar { display: flex; }
      header { padding: 0.75rem 1rem; }
      main { padding: 1rem 1rem 1.5rem; }
    }
    @media (min-width: 721px) {
      body.m-shell { padding-bottom: 0; }
    }
    /* —— Google Tasks panel —— */
    .tasks-layout {
      display: grid; gap: 0.85rem;
    }
    @media (min-width: 900px) {
      .tasks-layout { grid-template-columns: 14rem 1fr; align-items: start; }
    }
    .tasks-lists {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 12px; padding: 0.65rem; display: grid; gap: 0.25rem;
      max-height: min(70vh, 36rem); overflow: auto;
    }
    .tasks-lists .list-btn {
      display: flex; justify-content: space-between; align-items: center; gap: 0.4rem;
      width: 100%; text-align: left; background: transparent; border: 1px solid transparent;
      border-radius: 8px; padding: 0.45rem 0.55rem; color: var(--text); font: inherit;
      cursor: pointer; font-weight: 600; font-size: 0.88rem;
    }
    .tasks-lists .list-btn:hover { border-color: var(--border); background: #0e151c; }
    .tasks-lists .list-btn.active {
      border-color: var(--accent); background: rgba(91,159,212,0.12); color: var(--accent);
    }
    .tasks-lists .list-btn .cnt {
      font-size: 0.72rem; color: var(--muted); font-variant-numeric: tabular-nums;
    }
    .tasks-lists .list-btn.active .cnt { color: var(--accent); }
    .tasks-main {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 12px; padding: 0.85rem 1rem; display: grid; gap: 0.65rem;
      min-height: 16rem;
    }
    .tasks-toolbar {
      display: flex; flex-wrap: wrap; gap: 0.4rem; align-items: center;
      justify-content: space-between;
    }
    .tasks-toolbar .left, .tasks-toolbar .right {
      display: flex; flex-wrap: wrap; gap: 0.35rem; align-items: center;
    }
    .task-compose {
      display: grid; gap: 0.4rem;
      padding: 0.65rem; border: 1px solid var(--border); border-radius: 10px;
      background: #0e151c;
    }
    .task-compose input, .task-compose textarea, .task-compose select,
    .task-edit input, .task-edit textarea, .task-edit select,
    .tasks-lists-create input {
      background: #0a1016; border: 1px solid var(--border); color: var(--text);
      border-radius: 8px; padding: 0.45rem 0.6rem; font-size: 0.88rem;
      font-family: inherit; width: 100%; box-sizing: border-box;
    }
    .task-compose textarea, .task-edit textarea { resize: vertical; min-height: 3rem; }
    .task-row {
      display: grid; grid-template-columns: auto 1fr auto; gap: 0.55rem 0.65rem;
      align-items: start; padding: 0.55rem 0.45rem; border-radius: 10px;
      border: 1px solid transparent; border-bottom-color: var(--border);
    }
    .task-row:hover { background: #0e151c; border-color: var(--border); }
    .task-row.completed .task-title { text-decoration: line-through; opacity: 0.65; }
    .task-row.child { margin-left: 1.25rem; }
    .task-check {
      width: 1.25rem; height: 1.25rem; margin-top: 0.15rem; cursor: pointer;
      accent-color: var(--green);
    }
    .task-title { font-weight: 650; font-size: 0.95rem; }
    .task-meta {
      display: flex; flex-wrap: wrap; gap: 0.3rem; margin-top: 0.25rem;
      color: var(--muted); font-size: 0.78rem;
    }
    .task-notes {
      color: var(--muted); font-size: 0.82rem; margin-top: 0.25rem;
      white-space: pre-wrap; max-height: 6rem; overflow: auto;
    }
    .task-actions { display: flex; flex-direction: column; gap: 0.25rem; align-items: flex-end; }
    .task-actions button { font-size: 0.75rem; padding: 0.25rem 0.5rem; }
    .gh-chip {
      display: inline-flex; align-items: center; gap: 0.2rem;
      padding: 0.1rem 0.45rem; border-radius: 999px; font-size: 0.72rem; font-weight: 650;
      border: 1px solid #3a4570; background: #121c28; color: var(--blue);
      text-decoration: none;
    }
    .gh-chip:hover { border-color: var(--accent); color: var(--accent); }
    .due-soon { color: var(--yellow); font-weight: 650; }
    .due-over { color: var(--red); font-weight: 700; }
    .tasks-summary {
      display: flex; flex-wrap: wrap; gap: 0.4rem; align-items: center;
      margin-bottom: 0.35rem;
    }
    .task-edit {
      grid-column: 1 / -1; display: grid; gap: 0.4rem;
      margin-top: 0.35rem; padding-top: 0.5rem; border-top: 1px solid var(--border);
    }
    .btn-danger:hover { border-color: var(--red); color: var(--red); }
    .btn-primary {
      background: #1a3a55; border-color: #2d6a9f;
    }
    .btn-primary:hover { border-color: var(--accent); color: var(--accent); }
    .auth-warn {
      background: #2a2410; border: 1px solid #6b5a1e; color: var(--yellow);
      padding: 0.75rem 1rem; border-radius: 10px; font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <div>
        <h1>Workflow Management</h1>
        <div class="sub">personal-workspace · pre-reset readiness</div>
      </div>
      <div class="header-meta" id="header-meta"></div>
    </div>
    <div class="actions">
      <label class="toggle"><input type="checkbox" id="only-touched" checked /> Touched only</label>
      <span id="updated" class="sub"></span>
      <button type="button" id="btn-session-index" title="Write ops/session-index to disk">Session index</button>
      <button type="button" id="btn-sync" title="Session index + commit + push">Protect &amp; push</button>
      <button type="button" id="btn-refresh">Refresh</button>

  </header>
  <nav class="top-tabs" id="top-tabs" aria-label="Main sections">
    <button type="button" class="tab-btn active" data-m-tab="status" aria-current="page">
      <span class="tab-ico" aria-hidden="true">◎</span><span class="tab-lbl">Status</span>
    </button>
    <button type="button" class="tab-btn" data-m-tab="plan">
      <span class="tab-ico" aria-hidden="true">☰</span><span class="tab-lbl">Plan</span>
    </button>
    <button type="button" class="tab-btn" data-m-tab="tasks">
      <span class="tab-ico" aria-hidden="true">☑</span><span class="tab-lbl">Tasks</span>
      <span class="tab-count" id="tasks-tab-count" hidden>0</span>
    </button>
    <button type="button" class="tab-btn" data-m-tab="repo">
      <span class="tab-ico" aria-hidden="true">⎇</span><span class="tab-lbl">Repo</span>
    </button>

  <main>
    <div id="err" class="error-banner" role="alert"></div>
    <div id="action-msg" class="error-banner" style="background:#0f2419;border-color:#245c42;color:var(--green)"></div>

    <section data-m-panel="status">
      <div class="section-title compact">Pre-reset status <span class="sub" style="text-transform:none;letter-spacing:0;font-weight:500">· click a box to expand</span></div>
      <div class="summary" id="summary"></div>
      <div id="strategy-focus"></div>
    </section>

    <section data-m-panel="plan">
      <div id="bridge"></div>
      <div id="recommendations"></div>
      <div id="backlog"></div>
    </section>

    <section data-m-panel="tasks">
      <div class="section-title">Google Tasks <span class="sub" style="text-transform:none;letter-spacing:0;font-weight:500">· lists · create · edit · complete · GitHub issue chips</span></div>
      <div id="tasks-root"><div class="empty">Loading tasks…</div></div>
    </section>

    <section data-m-panel="repo">
      <div id="branches"></div>
      <div id="resume"></div>
      <div class="section-title">Projects (exit readiness by area)</div>
      <div id="list"><div class="empty">Loading…</div></div>
      <div id="listeners"></div>
      <footer id="footer"></footer>
    </section>
  </main>
  <nav class="mobile-tabbar" id="mobile-tabbar" aria-label="Main sections">
    <button type="button" class="tab-btn active" data-m-tab="status" aria-current="page">
      <span class="tab-ico" aria-hidden="true">◎</span><span class="tab-lbl">Status</span>
    </button>
    <button type="button" class="tab-btn" data-m-tab="plan">
      <span class="tab-ico" aria-hidden="true">☰</span><span class="tab-lbl">Plan</span>
    </button>
    <button type="button" class="tab-btn" data-m-tab="tasks">
      <span class="tab-ico" aria-hidden="true">☑</span><span class="tab-lbl">Tasks</span>
    </button>
    <button type="button" class="tab-btn" data-m-tab="repo">
      <span class="tab-ico" aria-hidden="true">⎇</span><span class="tab-lbl">Repo</span>
    </button>
  </nav>
  <script>
    const $ = (id) => document.getElementById(id);
    function esc(s) {
      return String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }
    /** Light markdown for focus lines: bold, italic, links — safe after escape. */
    function mdInline(s) {
      let t = String(s ?? "");
      // [label](url) → label
      t = t.replace(/\[([^\]]+)\]\([^)]+\)/g, "$1");
      t = esc(t);
      // **bold** first
      t = t.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      // *italic* (single asterisks, not part of bold leftovers)
      t = t.replace(/\*([^*\n]+)\*/g, "<em>$1</em>");
      // _italic_
      t = t.replace(/_([^_\n]+)_/g, "<em>$1</em>");
      // strip any leftover ** markers
      t = t.replace(/\*\*/g, "");
      return t;
    }
    function fmtWhen(iso) {
      if (!iso) return "—";
      try {
        const d = new Date(iso);
        if (Number.isNaN(d.getTime())) return esc(iso);
        return d.toLocaleString(undefined, { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
      } catch { return esc(iso); }
    }
    function remoteLinks(remotes) {
      if (!remotes?.length) return "—";
      return remotes.map((r) => {
        let href = r.url || "";
        if (href.startsWith("git@")) {
          const m = href.match(/^git@([^:]+):(.+?)(?:\.git)?$/);
          if (m) href = `https://${m[1]}/${m[2].replace(/\.git$/, "")}`;
        } else if (href.endsWith(".git")) href = href.replace(/\.git$/, "");
        const label = `${r.name}: ${r.url}`;
        return href.startsWith("http")
          ? `<a href="${esc(href)}" target="_blank" rel="noopener">${esc(label)}</a>`
          : esc(label);
      }).join("<br>");
    }
    function copyText(text) {
      navigator.clipboard?.writeText(text).catch(() => {});
    }

    // Remember which pre-reset indicators are expanded across refresh
    window.__openChecks = window.__openChecks || new Set();

    function render(data) {
      const r = data.readiness || {};
      const ws = data.workspace || {};
      const projects = data.projects || [];
      const c = r.counts || {};
      const verdict = r.verdict || "caution";
      const br = data.branches || {};
      const checks = r.checks || [];
      const byId = Object.fromEntries(checks.map((ch) => [ch.id, ch]));

      // Header: branch + git status + verdict
      const verdictClass = verdict === "ready" ? "clean" : verdict === "blocked" ? "dirty" : "dirty";
      $("header-meta").innerHTML = `
        <span class="pill branch" title="Current branch">${esc(br.current || ws.branch || "—")}</span>
        <span class="pill ${ws.dirty ? "dirty" : "clean"}" title="Working tree">${esc(ws.status_label || "—")}</span>
        <span class="pill ${verdict === "ready" ? "clean" : "dirty"}" title="${esc(r.verdict_label || "")}">${esc(verdict)}</span>
        ${ws.upstream ? `<span class="pill muted" title="Upstream">${esc(ws.upstream)}</span>` : ""}
        ${(ws.remotes && ws.remotes[0]) ? `<span class="pill muted" title="${esc(ws.remotes[0].url)}">remote</span>` : ""}
      `;

      // Map checklist items → expandable status indicator boxes
      const indicators = [
        {
          id: "uncommitted",
          label: "Uncommitted",
          value: c.dirty_files ?? 0,
          color: "var(--yellow)",
          check: byId.uncommitted,
        },
        {
          id: "unpushed",
          label: "Unpushed",
          value: c.ahead ?? "—",
          color: "var(--accent)",
          check: byId.unpushed || byId.behind,
        },
        {
          id: "sessions_disk",
          label: "Sessions on disk",
          value: c.persisted_sessions ?? 0,
          color: "var(--green)",
          check: byId.sessions_disk,
        },
        {
          id: "live_agents",
          label: "Live agents",
          value: c.live_sessions ?? 0,
          color: "var(--purple)",
          check: byId.live_agents,
        },
        {
          id: "dirty_projects",
          label: "Dirty areas",
          value: c.dirty_projects ?? 0,
          color: "var(--yellow)",
          check: byId.dirty_projects,
        },
        {
          id: "servers",
          label: "Servers",
          value: c.listeners ?? 0,
          color: "var(--blue)",
          check: byId.servers,
        },
        {
          id: "stashes",
          label: "Stashes",
          value: c.stashes ?? 0,
          color: "var(--muted)",
          check: byId.stashes,
        },
      ].filter((ind) => ind.check || ind.value);

      // Also surface any checklist items not mapped above
      const mappedIds = new Set(indicators.map((i) => i.id));
      for (const ch of checks) {
        if (!mappedIds.has(ch.id) && ch.id !== "behind") {
          indicators.push({
            id: ch.id,
            label: ch.title || ch.id,
            value: (ch.level || "").toUpperCase(),
            color: ch.level === "ok" ? "var(--green)" : ch.level === "warn" ? "var(--yellow)" : "var(--accent)",
            check: ch,
          });
        }
      }

      $("summary").innerHTML = indicators.map((ind) => {
        const ch = ind.check || {};
        const level = ch.level || "info";
        const open = window.__openChecks.has(ind.id);
        const paths = (ch.paths || []).slice(0, 12);
        return `
          <button type="button" class="stat lvl-${esc(level)}${open ? " open" : ""}" data-check-id="${esc(ind.id)}" aria-expanded="${open}">
            <div class="stat-top">
              <div>
                <div class="n" style="color:${ind.color}">${esc(ind.value)}</div>
                <div class="l">${esc(ind.label)}</div>
              </div>
              <div style="display:flex;flex-direction:column;align-items:flex-end;gap:0.25rem">
                <span class="lvl ${esc(level)}">${esc(level)}</span>
                <span class="chev">▶</span>
              </div>
            </div>
            <div class="stat-detail">
              <div class="title">${esc(ch.title || ind.label)}</div>
              <div class="detail">${esc(ch.detail || "No additional detail.")}</div>
              ${ch.action ? `<code>${esc(ch.action)}</code>` : ""}
              ${paths.length ? `<ul class="dirty-list">${paths.map((p) => `<li>${esc(p)}</li>`).join("")}</ul>` : ""}
            </div>
          </button>`;
      }).join("");

      // Strategy focus panel (planning content — not a project card)
      const sf = data.strategy_focus || {};
      const openFocus = sf.open_items || [];
      const doneFocus = sf.done_items || [];
      $("strategy-focus").innerHTML = `
        <div class="section-title">Today's focus <span class="sub" style="text-transform:none;letter-spacing:0;font-weight:500">· strategy/today.md (planning, not a project)</span></div>
        <div class="card">
          <div class="detail" style="color:var(--muted);font-size:0.88rem;margin-bottom:0.5rem">
            ${esc(sf.note || "North-star planning content.")}
            ${sf.bets_blurb ? `<br/><span class="id">Bets: ${esc(sf.bets_blurb)}</span>` : ""}
          </div>
          ${!openFocus.length && !doneFocus.length
            ? `<div class="empty" style="padding:0.75rem">No checklist items in strategy/today.md yet.</div>`
            : `
              ${openFocus.length ? `
                <h3 style="margin:0 0 0.35rem;font-size:0.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em">Open (${openFocus.length})</h3>
                <ul class="dirty-list" style="margin-bottom:0.65rem">
                  ${openFocus.map((t) => `<li style="margin:0.25rem 0;color:var(--text);font-family:inherit;font-size:0.9rem;list-style:disc">${mdInline(t)}</li>`).join("")}
                </ul>
              ` : ""}
              ${doneFocus.length ? `
                <h3 style="margin:0.5rem 0 0.35rem;font-size:0.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em">Done (${doneFocus.length})</h3>
                <ul class="dirty-list">
                  ${doneFocus.slice(0, 5).map((t) => `<li style="margin:0.2rem 0;opacity:0.7;font-family:inherit;font-size:0.85rem;list-style:disc;text-decoration:line-through">${mdInline(t)}</li>`).join("")}
                </ul>
              ` : ""}
            `}
          <div class="id" style="margin-top:0.5rem">Edit <code>strategy/today.md</code> · promote open items via recommendations/backlog</div>
        </div>`;

      // Workflow ↔ Time allocator bridge
      const bridge = data.bridge || {};
      const bCand = bridge.candidates || [];
      const bLinked = bridge.linked || [];
      $("bridge").innerHTML = `
        <div class="section-title">Day bridge <span class="sub" style="text-transform:none;letter-spacing:0;font-weight:500">· backlog → time allocator (not a merge)</span></div>
        <div class="card">
          <div style="display:flex;flex-wrap:wrap;gap:0.5rem;align-items:flex-start;justify-content:space-between;margin-bottom:0.5rem">
            <div class="detail" style="color:var(--muted);font-size:0.88rem;max-width:42rem">
              ${esc(bridge.note || "Push ranked backlog work into today's minute plan.")}
              ${bridge.allocator_url ? ` · <a href="${esc(bridge.allocator_url)}" target="_blank" rel="noopener" style="color:var(--accent)">Open time allocator</a>` : ""}
            </div>
            <button type="button" id="btn-bridge-top" title="Send top unlinked candidate">Send top to today</button>
          </div>
          ${!bCand.length ? `<div class="empty" style="padding:0.65rem">No strong candidates (groom backlog so items get schedule/rank).</div>` :
            bCand.slice(0, 6).map((c) => `
              <div class="sess">
                <div>${c.already_linked ? `<span class="pill clean">linked</span>` : `<span class="pill session">#${esc(c.press_rank || "—")}</span>`}</div>
                <div>
                  <div class="title">${esc(c.title)}</div>
                  <div class="id">${esc(c.schedule_label || c.schedule_slot || "")} · ${esc(c.priority)} · ${esc(c.status)}${c.area ? ` · ${esc(c.area)}` : ""}</div>
                </div>
                <div>
                  ${c.already_linked
                    ? `<span class="pill muted">${esc(c.allocator_id || "on day list")}</span>`
                    : `<button type="button" class="btn-bl-to-day" data-id="${esc(c.backlog_id)}">Send to today</button>`}
                </div>
              </div>`).join("")}
          ${bLinked.length ? `
            <h3 style="margin:0.75rem 0 0.35rem;font-size:0.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em">Already on day list (${bLinked.length})</h3>
            ${bLinked.slice(0, 5).map((l) => `
              <div class="sess">
                <div><span class="pill clean">${esc(l.minutes ?? 0)}m</span></div>
                <div><div class="title">${esc(l.title)}</div><div class="id">pri ${esc(l.priority)} · backlog ${esc((l.backlog_id || "").slice(0, 8))}</div></div>
                <div class="when"></div>
              </div>`).join("")}
          ` : ""}
        </div>`;

      // Recommendations panel — press rank + priority color coding
      const rec = data.recommendations || {};
      const ranked = rec.ranked || rec.pending || [];
      const byPri = rec.by_priority || [];
      const recHist = (rec.history || []).slice().reverse().slice(0, 8);
      const view = window.__recView || "press"; // press | priority

      function priClass(p) {
        const x = (p || "medium").toLowerCase();
        return ["critical", "high", "medium", "low"].includes(x) ? x : "medium";
      }
      function rankBadgeClass(n) {
        if (n === 1) return "r1";
        if (n === 2) return "r2";
        if (n === 3) return "r3";
        return "";
      }
      function renderRecCard(s) {
        const pri = priClass(s.priority);
        const rank = s.press_rank || "—";
        const reasons = (s.rank_reasons || []).slice(0, 3).map((r) => esc(r)).join(" · ");
        const body = s.kind === "new_item"
          ? esc((s.description || s.rationale || "").slice(0, 280))
          : esc(s.action || s.description || "");
        return `
          <article class="rec-card pri-${pri}${rank === 1 ? " rank-1" : ""}" data-id="${esc(s.id)}">
            <div class="rank-head">
              <div class="rank-badge ${rankBadgeClass(rank)}" title="Press rank ${rank} (score ${s.score ?? "—"})">#${rank}</div>
              <div>
                <div style="display:flex;flex-wrap:wrap;gap:0.35rem;align-items:center">
                  <span class="title" style="font-weight:650">${esc(s.title)}</span>
                  ${s.rank_label ? `<span class="pill pri-${pri}">${esc(s.rank_label)}</span>` : ""}
                </div>
                <div class="detail" style="color:var(--muted);font-size:0.85rem;margin-top:0.25rem">${body}</div>
                ${s.mvp_scope ? `<div class="id" style="margin-top:0.2rem">MVP: ${esc(s.mvp_scope)}</div>` : ""}
                <div class="id" style="margin-top:0.2rem">${esc(s.rationale || "")}</div>
                ${reasons ? `<div class="id" style="margin-top:0.15rem;color:var(--accent)">Why this rank: ${reasons}</div>` : ""}
              </div>
              <div style="display:flex;flex-direction:column;gap:0.3rem;align-items:flex-end">
                <span class="pill pri-${pri}">${esc(s.priority || "medium")}</span>
                <span class="pill ${s.kind === "new_item" ? "active" : "muted"}">${esc(s.kind === "new_item" ? "new" : "action")}</span>
                ${s.area ? `<span class="pill branch">${esc(s.area)}</span>` : ""}
                ${s.score != null ? `<span class="pill muted">score ${esc(s.score)}</span>` : ""}
              </div>
            </div>
            <div style="display:flex;gap:0.35rem;flex-wrap:wrap;margin-top:0.25rem">
              <button type="button" class="btn-rec-approve" data-id="${esc(s.id)}">${s.kind === "new_item" ? "Approve → backlog" : "Approve"}</button>
              <button type="button" class="btn-rec-reject" data-id="${esc(s.id)}">Reject</button>
            </div>
          </article>`;
      }

      let bodyHtml = "";
      if (!ranked.length) {
        bodyHtml = `<div class="empty" style="padding:0.75rem">No suggestions — add backlog items or refresh.</div>`;
      } else if (view === "priority") {
        bodyHtml = byPri.map((g) => `
          <div class="pri-band ${esc(g.priority)}">${esc(g.label)} · ${g.count} item${g.count === 1 ? "" : "s"}</div>
          ${(g.items || []).map(renderRecCard).join("")}
        `).join("");
      } else {
        const top = ranked.filter((s) => (s.press_rank || 99) <= 3);
        const rest = ranked.filter((s) => (s.press_rank || 99) > 3);
        bodyHtml = `
          <h3 style="margin:0.35rem 0 0.4rem;font-size:0.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em">Press order — do these first</h3>
          ${top.map(renderRecCard).join("")}
          ${rest.length ? `
            <h3 style="margin:0.75rem 0 0.4rem;font-size:0.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em">Then / when free</h3>
            ${rest.map(renderRecCard).join("")}
          ` : ""}
        `;
      }

      $("recommendations").innerHTML = `
        <div class="section-title">Recommended next steps</div>
        <div class="card">
          <div style="display:flex;flex-wrap:wrap;gap:0.5rem;align-items:flex-start;justify-content:space-between;margin-bottom:0.5rem">
            <div class="detail" style="color:var(--muted);font-size:0.88rem;max-width:40rem">
              Ranked by <strong>press order</strong> (#1 = do first): priority + urgency (dirty git, ready to initiate, in-flight planning, today’s focus).
              Color = priority. <strong>Approve</strong> applies; <strong>Reject</strong> dismisses.
              ${rec.generated_at ? `<br/><span class="id">Generated ${esc(fmtWhen(rec.generated_at))}</span>` : ""}
              <div class="legend-row">
                <span class="pill pri-critical">critical</span>
                <span class="pill pri-high">high</span>
                <span class="pill pri-medium">medium</span>
                <span class="pill pri-low">low</span>
              </div>
            </div>
            <div style="display:flex;flex-direction:column;gap:0.35rem;align-items:flex-end">
              <div class="view-toggle">
                <button type="button" id="btn-rec-view-press" class="${view === "press" ? "active" : ""}">Press order</button>
                <button type="button" id="btn-rec-view-priority" class="${view === "priority" ? "active" : ""}">By priority</button>
              </div>
              <button type="button" id="btn-rec-refresh">Refresh suggestions</button>
            </div>
          </div>
          ${bodyHtml}
          ${recHist.length ? `
            <h3 style="margin:0.85rem 0 0.35rem;font-size:0.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em">Recent decisions</h3>
            ${recHist.map((s) => `
              <div class="sess">
                <div><span class="pill ${s.status === "approved" ? "clean" : "muted"}">${esc(s.status)}</span></div>
                <div><div class="title">${esc(s.title)}</div><div class="id">#${esc(s.press_rank || "—")} · ${esc(s.kind)} · ${esc(s.priority || "")}</div></div>
                <div class="when">${fmtWhen(s.resolved_at)}</div>
              </div>`).join("")}
          ` : ""}
        </div>`;

      // Backlog panel — press rank, priority colors, schedule bands + auto-groom
      const bl = data.backlog || {};
      const blView = window.__blView || "press"; // press | schedule | priority
      const blRanked = bl.ranked || bl.items || [];
      const blBySched = bl.by_schedule || [];
      const blByPri = bl.by_priority || [];

      function blPri(p) {
        const x = (p || "medium").toLowerCase();
        return ["critical", "high", "medium", "low"].includes(x) ? x : "medium";
      }
      function blRankCls(n) {
        if (n === 1) return "r1";
        if (n === 2) return "r2";
        if (n === 3) return "r3";
        return "";
      }
      window.__blEditOpen = window.__blEditOpen || new Set();
      const fieldStyle = "background:#0a1016;border:1px solid var(--border);color:var(--text);border-radius:8px;padding:0.4rem 0.55rem;font-size:0.85rem;width:100%;font-family:inherit;box-sizing:border-box";

      const focusItem = (new URLSearchParams(location.search)).get("item") || "";
      const fromOrchestra = (new URLSearchParams(location.search)).get("from") === "orchestra";
      const orchestraRec = (new URLSearchParams(location.search)).get("orchestra_rec") || "";

      function renderBlCard(it) {
        const pri = blPri(it.priority);
        const rank = it.press_rank || "—";
        const reasons = (it.rank_reasons || []).slice(0, 3).map((r) => esc(r)).join(" · ");
        const editing = window.__blEditOpen.has(it.id);
        const priOpts = ["low", "medium", "high", "critical"].map((p) =>
          `<option value="${p}"${(it.priority || "medium") === p ? " selected" : ""}>${p}</option>`
        ).join("");
        const focused = focusItem && it.id === focusItem;
        const orchQs = new URLSearchParams({ backlog: it.id });
        if (orchestraRec) orchQs.set("rec", orchestraRec);
        const orchUrl = `http://127.0.0.1:8790/?${orchQs.toString()}`;
        const holUrl = `http://127.0.0.1:8770/?backlog=${encodeURIComponent(it.id)}${orchestraRec ? `&orchestra_rec=${encodeURIComponent(orchestraRec)}` : ""}&from=workflow`;
        return `
          <article class="rec-card pri-${pri}${rank === 1 ? " rank-1" : ""}${focused ? " orch-focus" : ""}" data-bl-id="${esc(it.id)}" id="bl-${esc(it.id)}">
            <div class="rank-head">
              <div class="rank-badge ${blRankCls(rank)}" title="Press rank ${rank} · score ${it.score ?? "—"}">#${rank}</div>
              <div>
                <div style="display:flex;flex-wrap:wrap;gap:0.35rem;align-items:center">
                  <span class="title" style="font-weight:650">${esc(it.title)}</span>
                  ${it.rank_label ? `<span class="pill pri-${pri}">${esc(it.rank_label)}</span>` : ""}
                  ${it.schedule_label ? `<span class="pill branch">${esc(it.schedule_label)}</span>` : ""}

    /** Lane palette for graph columns (cycles). */
    const LANE_COLORS = ["#7c9cff", "#c084fc", "#3dd68c", "#5b9fd4", "#f5c542", "#ff8fab", "#64d2ff", "#a78bfa"];

    function wireBranchPanel() {
      const gBtn = $("btn-graph-view");

    /** Compact committer timestamp for graph rows (newest → oldest top→bottom). */
    function formatGraphDate(iso) {
      if (!iso) return "—";
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return String(iso).slice(0, 16);
      // Local wall clock, fixed width-ish: "Aug 03 15:36"
      const mon = d.toLocaleString(undefined, { month: "short" });
      const day = String(d.getDate()).padStart(2, "0");
      const hh = String(d.getHours()).padStart(2, "0");
      const mm = String(d.getMinutes()).padStart(2, "0");
      return `${mon} ${day} ${hh}:${mm}`;
    }

    function renderBranchGraphSvg(g) {
      const commits = g.commits || [];
      const edges = g.edges || [];
      if (!commits.length) {
        return `<div class="empty" style="margin:0.5rem;border:none">No commits in graph window.</div>`;
      }
      const laneCount = Math.max(1, g.lane_count || 1);
      const rowH = 26;
      const laneW = 16;
      const padL = 12;
      const padT = 10;
      const textX = padL + laneCount * laneW + 18;
      const shaW = 58;
      const dateW = 108; // room for "Aug 03 15:36"
      const subjX = textX + shaW + dateW;
      const width = Math.max(820, subjX + 480);
      const height = padT * 2 + commits.length * rowH;

      const cx = (lane) => padL + lane * laneW + laneW / 2;
      const cy = (row) => padT + row * rowH + rowH / 2;
      const laneColor = (lane) => LANE_COLORS[lane % LANE_COLORS.length];

      // Paths for edges (bezier vertical)
      const edgePaths = edges.map((e) => {
        const x1 = cx(e.from_lane), y1 = cy(e.from_row);
        const x2 = cx(e.to_lane), y2 = cy(e.to_row);
        const midY = (y1 + y2) / 2;
        const col = laneColor(e.from_lane);
        const dash = e.kind === "merge" ? ' stroke-dasharray="3 2"' : "";
        const d = x1 === x2
          ? `M ${x1} ${y1} L ${x2} ${y2}`
          : `M ${x1} ${y1} C ${x1} ${midY}, ${x2} ${midY}, ${x2} ${y2}`;
        return `<path d="${d}" fill="none" stroke="${col}" stroke-width="1.6" opacity="0.85"${dash}/>`;
      }).join("");

      const nodes = commits.map((c) => {
        const x = cx(c.lane), y = cy(c.row);
        const col = (c.labels && c.labels[0] && c.labels[0].color) || laneColor(c.lane);
        const r = c.is_head ? 5.5 : 4;
        const labels = (c.labels || []).slice(0, 4).map((lb) => {
          const bg = lb.color || col;
          return `<tspan fill="${bg}" font-weight="700">[${esc(lb.name)}] </tspan>`;
        }).join("");
        const subj = esc((c.subject || "").slice(0, 72));
        const when = esc(formatGraphDate(c.date));
        const title = esc([c.date, c.author, c.subject].filter(Boolean).join(" · "));
        const link = c.url
          ? `<a href="${esc(c.url)}" target="_blank" rel="noopener"><text x="${textX}" y="${y + 4}" font-size="11" font-family="ui-monospace,Menlo,monospace" fill="#8aa0b5">${esc(c.short)}</text></a>`
          : `<text x="${textX}" y="${y + 4}" font-size="11" font-family="ui-monospace,Menlo,monospace" fill="#8aa0b5">${esc(c.short)}</text>`;
        return `
          <g class="graph-row-hit">
            <title>${title}</title>
            <rect class="graph-bg" x="0" y="${cy(c.row) - rowH / 2}" width="${width}" height="${rowH}" fill="transparent"/>
            <circle cx="${x}" cy="${y}" r="${r}" fill="${col}" stroke="#0a1016" stroke-width="1.5"/>
            ${c.is_head ? `<circle cx="${x}" cy="${y}" r="${r + 3}" fill="none" stroke="${col}" stroke-width="1" opacity="0.7"/>` : ""}
            ${link}
            <text x="${textX + shaW}" y="${y + 4}" font-size="11" font-family="ui-monospace,Menlo,monospace" fill="#6b7c8f">${when}</text>
            <text x="${subjX}" y="${y + 4}" font-size="12" fill="#e7eef5">${labels}<tspan fill="#c5d0db">${subj}</tspan></text>
          </g>`;
      }).join("");

      return `<svg class="graph-svg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Git branch graph, newest commits at top">
        ${edgePaths}
        ${nodes}
      </svg>`;
    }

    async function loadBranchGraph(force) {
      const mount = $("branch-graph-mount");
      const meta = $("graph-meta");
      if (!mount) return;
      if (!force && window.__branchGraphCache && window.__branchGraphMode !== "list") {
        // still re-render from cache when panel rebuilt
      }
      const remotes = window.__branchGraphRemotes === false ? "0" : "1";
      try {
        if (meta) meta.textContent = "Loading graph…";
        const res = await fetch(`/api/branch-graph?max=80&remotes=${remotes}`, { cache: "no-store" });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const g = await res.json();
        if (!g.ok) throw new Error(g.error || "graph error");
        window.__branchGraphCache = g;
        mount.innerHTML = renderBranchGraphSvg(g);
        const links = g.links || {};
        const parts = [
          "newest at top",
          `${g.commit_count} commits`,
          `${g.lane_count} lanes`,
          g.current_branch ? `HEAD ${g.current_branch}` : "",
        ].filter(Boolean);
        let extra = "";
        if (links.github_network) {
          extra = ` · <a href="${esc(links.github_network)}" target="_blank" rel="noopener">GitHub Network</a>`;
          if (links.github_branches) {
            extra += ` · <a href="${esc(links.github_branches)}" target="_blank" rel="noopener">Branches</a>`;
          }
        }
        if (meta) meta.innerHTML = esc(parts.join(" · ")) + extra;
      } catch (e) {
        mount.innerHTML = `<div class="empty" style="margin:0.5rem;border:none">Graph failed: ${esc(e.message)}</div>`;
        if (meta) meta.textContent = "Graph error";
      }
    }

    async function load() {
      const btn = $("btn-refresh");
      btn.disabled = true;
      $("err").classList.remove("show");
      const only = $("only-touched").checked ? "1" : "0";
      try {
        const res = await fetch(`/api/projects?only_touched=${only}`, { cache: "no-store" });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || "API error");
        render(data);
        // Deep link from Orchestrator: ?item=<backlog_id>
        const focusId = (new URLSearchParams(location.search)).get("item");
        if (focusId) {
          const el = document.getElementById("bl-" + focusId)
            || document.querySelector(`[data-bl-id="${CSS.escape(focusId)}"]`);
          if (el) setTimeout(() => el.scrollIntoView({ behavior: "smooth", block: "center" }), 80);
        }
      } catch (e) {
        $("err").textContent = `Failed to load: ${e.message}`;
        $("err").classList.add("show");

        btn.disabled = false;
        if (window.__activeTab === "tasks") loadTasks();

    async function postAction(url, body) {
      $("action-msg").classList.remove("show");
      $("err").classList.remove("show");
      try {
        const res = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body || {}),
        });
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || JSON.stringify(data));
        let msg = data.message
          || (data.committed ? `Committed ${data.sha || ""} on ${data.branch || ""}` : "OK")
          + (data.pushed ? " · pushed" : "")
          + (data.count != null && data.sessions == null ? ` · ${data.count} sessions indexed` : "")
          + (data.added ? ` · imported ${data.added.length}` : "");
        if (data.steps) {
          msg = data.steps.map((s) => {
            const body = s.ok
              ? (s.committed ? `committed ${s.sha || ""}` : (s.message || "ok"))
              : (s.error || "fail");
            return `${s.step}:${body}`;
          }).join(" · ");
          // If any step left dirty / failed, surface as error not green OK
          if (data.steps.some((s) => s.ok === false)) {
            throw new Error(msg);
          }
        }
        if (data.goal_objective) {
          msg = `Initiated · seed ${data.seed_path || ""} · objective copied if Terminal launch ran. Paste /goal in Grok.`;
          copyText(data.goal_objective);
        }
        if (data.item && data.item.title && !data.goal_objective) {
          msg = `Saved: ${data.item.title}`;
        }
        if (data.groomed_at || data.applied) {
          msg = data.message || `Groomed ${data.count ?? ""} items`;
          if (data.changes && data.changes.length) {
            msg += ` · ${data.changes.length} hygiene change(s)`;
          }
        }
        if (data.allocator_url || data.already_linked != null || data.sent) {
          msg = data.message || (data.sent ? `Sent ${data.count} to day plan` : "Bridge OK");
        }
        if (data.committed) {
          msg = `Committed ${data.sha || ""} on ${data.branch || ""}${data.pushed ? " · pushed" : ""}`;
        }
        $("action-msg").textContent = msg;
        $("action-msg").classList.add("show");
        await load();
      } catch (e) {
        $("err").textContent = e.message;
        $("err").classList.add("show");
      }
    }

    function fmtDue(iso) {
      if (!iso) return "";
      try {
        const d = new Date(iso);
        if (Number.isNaN(d.getTime())) return iso.slice(0, 10);
        return d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
      } catch { return String(iso).slice(0, 10); }
    }
    function dueClass(iso) {
      if (!iso) return "";
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return "";
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const dd = new Date(d);
      dd.setHours(0, 0, 0, 0);
      const diff = (dd - today) / 86400000;
      if (diff < 0) return "due-over";
      if (diff <= 2) return "due-soon";
      return "";
    }
    function dueInputValue(iso) {
      if (!iso) return "";
      try {
        return new Date(iso).toISOString().slice(0, 10);
      } catch { return String(iso).slice(0, 10); }
    }

    async function tasksPost(url, body) {
      const res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body || {}),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || data.ok === false) {
        throw new Error(data.error || `HTTP ${res.status}`);
      }
      return data;
    }

    async function loadTasks(force) {
      const st = window.__tasksState;
      const root = $("tasks-root");
      if (!root) return;
      if (st.loading && !force) return;
      st.loading = true;
      if (!st.data) root.innerHTML = `<div class="empty">Loading tasks…</div>`;
      try {
        const qs = st.showCompleted ? "?completed=1" : "";
        const res = await fetch(`/api/tasks${qs}`, { cache: "no-store" });
        const data = await res.json();
        st.data = data;
        if (!data.ok) {
          root.innerHTML = `
            <div class="auth-warn">
              <strong>Google Tasks unavailable.</strong>
              ${esc(data.error || "Not authenticated")}
              ${data.auth && data.auth.hint ? `<br/><span class="id">${esc(data.auth.hint)}</span>` : ""}
              <br/><span class="id">Creds: ~/.config/google-tasks-mcp/ · Pi unit: google-tasks-mcp.service</span>
            </div>`;
          const cnt = $("tasks-tab-count");
          if (cnt) { cnt.hidden = true; }
          return;
        }
        const lists = data.lists || [];
        if (!st.listId || !lists.some((l) => l.id === st.listId)) {
          st.listId = lists[0] ? lists[0].id : null;
        }
        const openN = (data.summary && data.summary.open) || (data.all_open || []).length || 0;
        const cnt = $("tasks-tab-count");
        if (cnt) {
          cnt.textContent = String(openN);
          cnt.hidden = openN <= 0;
        }
        renderTasks();
      } catch (e) {
        root.innerHTML = `<div class="empty">Failed to load tasks: ${esc(e.message)}</div>`;
      } finally {
        st.loading = false;
      }
    }

    function tasksForActiveList() {
      const st = window.__tasksState;
      const data = st.data || {};
      const by = data.tasks_by_list || {};
      const pack = by[st.listId] || {};
      return pack.tasks || [];
    }

    function renderTasks() {
      const st = window.__tasksState;
      const root = $("tasks-root");
      if (!root || !st.data) return;
      const data = st.data;
      const lists = data.lists || [];
      const tasks = tasksForActiveList();
      const activeList = lists.find((l) => l.id === st.listId);
      const openCount = tasks.filter((t) => t.status === "needsAction").length;
      const doneCount = tasks.filter((t) => t.status === "completed").length;

      // Build parent/child map for indent
      const byParent = {};
      tasks.forEach((t) => {
        const p = t.parent || "";
        if (!byParent[p]) byParent[p] = [];
        byParent[p].push(t);
      });
      function walk(parentId, depth) {
        const kids = byParent[parentId || ""] || [];
        let out = [];
        kids.forEach((t) => {
          out.push({ task: t, depth });
          out = out.concat(walk(t.id, depth + 1));
        });
        return out;
      }
      // Roots = no parent or parent not in set
      const idSet = new Set(tasks.map((t) => t.id));
      const ordered = [];
      const seen = new Set();
      function addTree(t, depth) {
        if (seen.has(t.id)) return;
        seen.add(t.id);
        ordered.push({ task: t, depth });
        (byParent[t.id] || []).forEach((c) => addTree(c, depth + 1));
      }
      tasks.forEach((t) => {
        if (!t.parent || !idSet.has(t.parent)) addTree(t, 0);
      });

      const listBtns = lists.map((l) => {
        const pack = (data.tasks_by_list || {})[l.id] || {};
        const n = pack.open_count != null ? pack.open_count : ((pack.tasks || []).filter((x) => x.status === "needsAction").length);
        return `<button type="button" class="list-btn${l.id === st.listId ? " active" : ""}" data-task-list="${esc(l.id)}">
          <span>${esc(l.title || "Untitled")}</span>
          <span class="cnt">${n}</span>
        </button>`;
      }).join("");

      function renderTaskRow(item) {
        const t = item.task;
        const depth = item.depth;
        const editing = st.editId === t.id;
        const completed = t.status === "completed";
        const gh = (t.github || []).map((g) =>
          `<a class="gh-chip" href="${esc(g.url)}" target="_blank" rel="noopener" title="GitHub / Buzz board issue">${esc(g.label)}</a>`
        ).join(" ");
        const dcls = dueClass(t.due);
        const dueLabel = t.due ? `<span class="${dcls}">due ${esc(fmtDue(t.due))}</span>` : "";
        const listLabel = t.list_title && st.listId === "__all__" ? `<span class="pill muted">${esc(t.list_title)}</span>` : "";
        return `
          <div class="task-row${completed ? " completed" : ""}${depth ? " child" : ""}" data-task-id="${esc(t.id)}" data-list-id="${esc(t.list_id)}" style="${depth ? `margin-left:${Math.min(depth, 4) * 1.1}rem` : ""}">
            <input type="checkbox" class="task-check" data-task-complete ${completed ? "checked" : ""} title="${completed ? "Mark incomplete" : "Mark complete"}" />
            <div>
              <div class="task-title">${esc(t.title || "(no title)")}</div>
              <div class="task-meta">
                ${dueLabel}
                ${listLabel}
                ${t.updated ? `<span>upd ${esc(fmtWhen(t.updated))}</span>` : ""}
                ${gh}
              </div>
              ${t.notes && !editing ? `<div class="task-notes">${esc(t.notes)}</div>` : ""}
              ${editing ? `
                <div class="task-edit">
                  <input class="te-title" value="${esc(t.title || "")}" placeholder="Title" />
                  <textarea class="te-notes" rows="3" placeholder="Notes (use owner/repo#123 or gh:owner/repo#123 for GitHub chips)">${esc(t.notes || "")}</textarea>
                  <div style="display:flex;flex-wrap:wrap;gap:0.4rem;align-items:center">
                    <label class="id">Due <input type="date" class="te-due" value="${esc(dueInputValue(t.due))}" style="width:auto;margin-left:0.35rem" /></label>
                    <label class="toggle"><input type="checkbox" class="te-clear-due" /> clear due</label>
                    <select class="te-move-list" style="width:auto;min-width:10rem" title="Move to list">
                      ${lists.map((l) => `<option value="${esc(l.id)}"${l.id === t.list_id ? " selected" : ""}>${esc(l.title)}</option>`).join("")}
                    </select>
                  </div>
                  <div style="display:flex;flex-wrap:wrap;gap:0.35rem">
                    <button type="button" class="btn-primary" data-task-save>Save</button>
                    <button type="button" data-task-cancel-edit>Cancel</button>
                    <button type="button" class="btn-danger" data-task-delete>Delete</button>
                  </div>
                </div>
              ` : ""}
            </div>
            <div class="task-actions">
              ${!editing ? `<button type="button" data-task-edit>Edit</button>` : ""}
              ${!editing && !completed ? `<button type="button" data-task-complete-btn title="Complete">Done</button>` : ""}
              ${!editing && completed ? `<button type="button" data-task-reopen>Reopen</button>` : ""}
            </div>
          </div>`;
      }

      const rows = ordered.length
        ? ordered.map(renderTaskRow).join("")
        : `<div class="empty">No tasks in this list${st.showCompleted ? "" : " (open)"}. Add one below.</div>`;

      root.innerHTML = `
        <div class="tasks-summary">
          <span class="pill clean">${esc(String((data.summary && data.summary.open) || 0))} open total</span>
          <span class="pill branch">${esc(String(lists.length))} lists</span>
          ${activeList ? `<span class="pill muted">${esc(activeList.title)} · ${openCount} open${st.showCompleted ? ` · ${doneCount} done shown` : ""}</span>` : ""}
          <span class="id" style="margin-left:auto">API · Grok MCP · Rock chat via same tokens</span>
        </div>
        <div class="tasks-layout">
          <aside class="tasks-lists">
            <div class="id" style="padding:0.25rem 0.4rem;margin-bottom:0.2rem">Lists</div>
            ${listBtns || `<div class="empty" style="padding:0.5rem;border:none">No lists</div>`}
            <div class="tasks-lists-create" style="margin-top:0.5rem;padding-top:0.5rem;border-top:1px solid var(--border);display:grid;gap:0.35rem">
              <input id="new-list-title" placeholder="New list name" />
              <button type="button" id="btn-list-create" class="btn-primary">Create list</button>
            </div>
          </aside>
          <div class="tasks-main">
            <div class="tasks-toolbar">
              <div class="left">
                <strong>${esc((activeList && activeList.title) || "Tasks")}</strong>
              </div>
              <div class="right">
                <label class="toggle"><input type="checkbox" id="tasks-show-completed" ${st.showCompleted ? "checked" : ""} /> Show completed</label>
                <button type="button" id="btn-tasks-refresh">Refresh</button>
              </div>
            </div>
            <div class="task-compose">
              <input id="new-task-title" placeholder="New task title" />
              <textarea id="new-task-notes" rows="2" placeholder="Notes (optional) — paste owner/repo#123 to link GitHub/Buzz board issues"></textarea>
              <div style="display:flex;flex-wrap:wrap;gap:0.4rem;align-items:center">
                <label class="id">Due <input type="date" id="new-task-due" style="width:auto;margin-left:0.35rem" /></label>
                <button type="button" id="btn-task-add" class="btn-primary">Add task</button>
              </div>
            </div>
            <div id="tasks-list">${rows}</div>
          </div>
        </div>`;
    }

    async function afterTaskMutation(msg) {
      if (msg) {
        $("action-msg").textContent = msg;
        $("action-msg").classList.add("show");
      }
      $("err").classList.remove("show");
      window.__tasksState.editId = null;
      await loadTasks(true);
    }

    document.addEventListener("click", async (ev) => {
      const t = ev.target;
      if (!t) return;
      // List select
      const listBtn = t.closest && t.closest("[data-task-list]");
      if (listBtn) {
        window.__tasksState.listId = listBtn.getAttribute("data-task-list");
        window.__tasksState.editId = null;
        renderTasks();
        return;
      }
      if (t.id === "btn-tasks-refresh") {
        await loadTasks(true);
        return;
      }
      if (t.id === "btn-list-create") {
        const title = ($("new-list-title") && $("new-list-title").value) || "";
        if (!title.trim()) {
          $("err").textContent = "List title required";
          $("err").classList.add("show");
          return;
        }
        try {
          const r = await tasksPost("/api/tasks/lists/create", { title: title.trim() });
          window.__tasksState.listId = r.list && r.list.id;
          await afterTaskMutation(`List created: ${title.trim()}`);
        } catch (e) {
          $("err").textContent = e.message;
          $("err").classList.add("show");
        }
        return;
      }
      if (t.id === "btn-task-add") {
        const st = window.__tasksState;
        if (!st.listId) {
          $("err").textContent = "Select a list first";
          $("err").classList.add("show");
          return;
        }
        const title = ($("new-task-title") && $("new-task-title").value) || "";
        if (!title.trim()) {
          $("err").textContent = "Task title required";
          $("err").classList.add("show");
          return;
        }
        try {
          await tasksPost("/api/tasks", {
            list_id: st.listId,
            title: title.trim(),
            notes: ($("new-task-notes") && $("new-task-notes").value) || "",
            due: ($("new-task-due") && $("new-task-due").value) || null,
          });
          if ($("new-task-title")) $("new-task-title").value = "";
          if ($("new-task-notes")) $("new-task-notes").value = "";
          if ($("new-task-due")) $("new-task-due").value = "";
          await afterTaskMutation("Task created");
        } catch (e) {
          $("err").textContent = e.message;
          $("err").classList.add("show");
        }
        return;
      }

      const row = t.closest && t.closest(".task-row");
      if (!row) return;
      const taskId = row.getAttribute("data-task-id");
      const listId = row.getAttribute("data-list-id");
      if (!taskId || !listId) return;

      if (t.matches && (t.matches("[data-task-complete]") || t.matches("[data-task-complete-btn]"))) {
        const completed = t.matches("[data-task-complete]") ? !!t.checked : true;
        try {
          await tasksPost("/api/tasks/complete", { list_id: listId, task_id: taskId, completed });
          await afterTaskMutation(completed ? "Marked complete" : "Reopened");
        } catch (e) {
          $("err").textContent = e.message;
          $("err").classList.add("show");
          await loadTasks(true);
        }
        return;
      }
      if (t.matches && t.matches("[data-task-reopen]")) {
        try {
          await tasksPost("/api/tasks/complete", { list_id: listId, task_id: taskId, completed: false });
          await afterTaskMutation("Reopened");
        } catch (e) {
          $("err").textContent = e.message;
          $("err").classList.add("show");
        }
        return;
      }
      if (t.matches && t.matches("[data-task-edit]")) {
        window.__tasksState.editId = taskId;
        renderTasks();
        return;
      }
      if (t.matches && t.matches("[data-task-cancel-edit]")) {
        window.__tasksState.editId = null;
        renderTasks();
        return;
      }
      if (t.matches && t.matches("[data-task-delete]")) {
        if (!confirm("Delete this task permanently?")) return;
        try {
          await tasksPost("/api/tasks/delete", { list_id: listId, task_id: taskId });
          await afterTaskMutation("Task deleted");
        } catch (e) {
          $("err").textContent = e.message;
          $("err").classList.add("show");
        }
        return;
      }
      if (t.matches && t.matches("[data-task-save]")) {
        const title = (row.querySelector(".te-title") || {}).value || "";
        const notes = (row.querySelector(".te-notes") || {}).value || "";
        const due = (row.querySelector(".te-due") || {}).value || "";
        const clearDue = !!(row.querySelector(".te-clear-due") || {}).checked;
        const dest = (row.querySelector(".te-move-list") || {}).value || listId;
        if (!String(title).trim()) {
          $("err").textContent = "Title is required";
          $("err").classList.add("show");
          return;
        }
        try {
          await tasksPost("/api/tasks/update", {
            list_id: listId,
            task_id: taskId,
            title: String(title).trim(),
            notes,
            due: clearDue ? null : (due || null),
            clear_due: clearDue,
          });
          if (dest && dest !== listId) {
            await tasksPost("/api/tasks/move", {
              list_id: listId,
              task_id: taskId,
              destination_list: dest,
            });
            window.__tasksState.listId = dest;
          }
          await afterTaskMutation("Task updated");
        } catch (e) {
          $("err").textContent = e.message;
          $("err").classList.add("show");
        }
        return;
      }
    });

        load();
        return;
      }
      if (t.id === "btn-bl-view-priority") {
        window.__blView = "priority";
        load();
        return;
      }
      if (t.id === "btn-rec-refresh") {
        await postAction("/api/recommendations/refresh", {});
        return;
      }
      if (t.id === "btn-rec-view-press") {
        window.__recView = "press";
        load();
        return;
      }
      if (t.id === "btn-rec-view-priority") {
        window.__recView = "priority";
        load();
        return;
      }
      // Expand/collapse pre-reset status indicators
      const checkBtn = t.closest && t.closest("[data-check-id]");
      if (checkBtn && checkBtn.classList.contains("stat")) {
        const cid = checkBtn.getAttribute("data-check-id");
        if (window.__openChecks.has(cid)) window.__openChecks.delete(cid);
        else window.__openChecks.add(cid);
        checkBtn.classList.toggle("open");
        checkBtn.setAttribute("aria-expanded", checkBtn.classList.contains("open") ? "true" : "false");
        return;
      }
      const id = t.getAttribute && t.getAttribute("data-id");
      if (!id) return;
      if (t.classList.contains("btn-rec-approve")) {
        await postAction("/api/recommendations/approve", { id });
        return;
      }
      if (t.classList.contains("btn-rec-reject")) {
        await postAction("/api/recommendations/reject", { id });
        return;
      }
      if (t.classList.contains("btn-bl-edit")) {
        if (window.__blEditOpen.has(id)) window.__blEditOpen.delete(id);
        else window.__blEditOpen.add(id);
        load();
        return;
      }
      if (t.classList.contains("btn-bl-cancel-edit")) {
        window.__blEditOpen.delete(id);
        load();
        return;
      }
      if (t.classList.contains("btn-bl-save")) {
        const root = t.closest("[data-bl-id]") || t.closest(".rec-card");
        if (!root) return;
        const title = (root.querySelector(".bl-edit-title") || {}).value || "";
        if (!String(title).trim()) {
          $("err").textContent = "Title is required";
          $("err").classList.add("show");
          return;
        }
        await postAction("/api/backlog/update", {
          id,
          title: String(title).trim(),
          description: (root.querySelector(".bl-edit-desc") || {}).value || "",
          mvp_scope: (root.querySelector(".bl-edit-mvp") || {}).value || "",
          notes: (root.querySelector(".bl-edit-notes") || {}).value || "",
          priority: (root.querySelector(".bl-edit-priority") || {}).value || "medium",
          area: (root.querySelector(".bl-edit-area") || {}).value || "",
        });
        window.__blEditOpen.delete(id);
        return;
      }
      if (t.classList.contains("btn-bl-to-day")) {
        await postAction("/api/bridge/to-allocator", { backlog_id: id });
        return;
      }
      if (t.classList.contains("btn-bl-initiate")) {
        // Idea → Initiate is intentional; no ready gate
        await postAction("/api/backlog/initiate", { id, spawn: true });
        return;
      }
      if (t.classList.contains("btn-bl-done")) {
        await postAction("/api/backlog/update", { id, status: "done" });
        return;
      }
      if (t.classList.contains("btn-bl-park")) {
        await postAction("/api/backlog/update", { id, status: "parked" });
        return;
      }
      if (t.classList.contains("btn-bl-del")) {
        if (!confirm("Delete this backlog item?")) return;
        await postAction("/api/backlog/delete", { id });
      }
    });
    initTabShell();
    load();
  </script>
</body>
</html>
