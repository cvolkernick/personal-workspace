<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Workflow — Autonomous Dev Loop</title>
  <style>
    :root {
      --bg: #0b0f14;
      --panel: #121a22;
      --border: #1e2a36;
      --text: #e7eef5;
      --muted: #8aa0b5;
      --green: #3dd68c;
      --yellow: #f5c542;
      --red: #ff6b6b;
      --accent: #5b9fd4;
      --blue: #7c9cff;
      --purple: #c084fc;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: radial-gradient(1200px 600px at 10% -10%, #152033 0%, var(--bg) 55%);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.45;
    }
    header {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex; flex-wrap: wrap; gap: 0.75rem 1.25rem;
      align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 40;
      background: rgba(11,15,20,0.92);
      backdrop-filter: blur(8px);
    }
    header h1 { margin: 0; font-size: 1.15rem; font-weight: 650; letter-spacing: -0.02em; }
    header .sub { color: var(--muted); font-size: 0.82rem; }
    header .header-left { display: flex; flex-wrap: wrap; gap: 0.5rem 1rem; align-items: center; }
    header .header-meta { display: flex; flex-wrap: wrap; gap: 0.35rem; align-items: center; }
    .actions { display: flex; gap: 0.45rem; align-items: center; flex-wrap: wrap; }
    button, label.toggle, select, input, textarea {
      background: var(--panel); color: var(--text);
      border: 1px solid var(--border); border-radius: 8px;
      padding: 0.42rem 0.85rem; font-size: 0.88rem; font-weight: 600;
    }
    button { cursor: pointer; }
    button:hover { border-color: var(--accent); color: var(--accent); }
    button:disabled { opacity: 0.5; cursor: wait; }
    button.btn-accent {
      border-color: #245c42; color: var(--green); background: #0f2419;
    }
    button.btn-accent:hover { border-color: var(--green); }
    button.btn-accent.on { background: #163526; box-shadow: 0 0 0 1px rgba(61,214,140,0.35); }
    button.btn-kick { border-color: #2a4a66; color: var(--accent); background: #121c28; }
    label.toggle { display: inline-flex; gap: 0.4rem; align-items: center; font-weight: 500; color: var(--muted); cursor: pointer; }
    main { max-width: 980px; margin: 0 auto; padding: 1rem 1.25rem 3rem; }
    .error-banner {
      background: #2a1515; border: 1px solid #6b2e2e; color: var(--red);
      padding: 0.7rem 1rem; border-radius: 8px; margin-bottom: 0.85rem; display: none;
    }
    .error-banner.show { display: block; }
    #action-msg { background: #0f2419; border-color: #245c42; color: var(--green); }
    .pipeline {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 0.55rem;
      margin-bottom: 1rem;
    }
    .pipe-stat {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.75rem 0.9rem;
      text-align: left;
      cursor: pointer;
      color: inherit;
      font: inherit;
      width: 100%;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .pipe-stat:hover { border-color: var(--accent); }
    .pipe-stat .n {
      font-size: 1.55rem; font-weight: 750; font-variant-numeric: tabular-nums;
      line-height: 1.1;
    }
    .pipe-stat .l {
      color: var(--muted); font-size: 0.72rem; text-transform: uppercase;
      letter-spacing: 0.05em; margin-top: 0.25rem; font-weight: 600;
    }
    .pipe-stat .hint { color: var(--muted); font-size: 0.75rem; margin-top: 0.2rem; font-weight: 500; }
    .pipe-stat.has-alert { border-color: #245c42; box-shadow: 0 0 0 1px rgba(61,214,140,0.2); }
    .pipe-stat.has-warn { border-color: #6b5a1e; }
    .pipe-stat.has-run { border-color: #5b3a7a; }
    .card {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 12px; padding: 0.95rem 1.1rem; margin-bottom: 0.85rem;
    }
    .section-title {
      margin: 1.15rem 0 0.5rem; font-size: 0.8rem; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.06em; font-weight: 700;
    }
    .section-title .sub {
      text-transform: none; letter-spacing: 0; font-weight: 500; color: var(--muted);
    }
    .pill {
      display: inline-flex; align-items: center; gap: 0.3rem;
      padding: 0.2rem 0.5rem; border-radius: 999px; font-weight: 600; font-size: 0.7rem;
      border: 1px solid var(--border); background: #0e151c;
    }
    .pill.clean { color: var(--green); border-color: #245c42; }
    .pill.dirty { color: var(--yellow); border-color: #6b5a1e; }
    .pill.branch { color: var(--blue); border-color: #3a4570; }
    .pill.active { color: var(--green); border-color: #245c42; background: #0f2419; }
    .pill.session { color: var(--purple); border-color: #5b3a7a; }
    .pill.muted { color: var(--muted); font-weight: 500; }
    .pill.auto-on { color: var(--green); border-color: #245c42; background: #0f2419; }
    .pill.pri-critical { color: #ff6b6b; border-color: #6b2e2e; background: #2a1515; }
    .pill.pri-high { color: #f5a623; border-color: #6b4a1e; background: #2a1f10; }
    .pill.pri-medium { color: #5b9fd4; border-color: #2a4a66; background: #121c28; }
    .pill.pri-low { color: #8aa0b5; border-color: #2a3540; background: #141a20; }
    .sess {
      display: grid; grid-template-columns: auto 1fr auto; gap: 0.5rem 0.75rem;
      align-items: start; padding: 0.5rem 0.55rem; border-radius: 8px;
      background: #0e151c; font-size: 0.85rem; margin-top: 0.4rem;
    }
    .sess .title { font-weight: 600; }
    .sess .id { color: var(--muted); font-family: ui-monospace, Menlo, monospace; font-size: 0.72rem; }
    .sess .when { color: var(--muted); font-size: 0.75rem; white-space: nowrap; }
    .sess a { color: var(--accent); }
    .empty {
      color: var(--muted); text-align: center; padding: 0.9rem;
      border: 1px dashed var(--border); border-radius: 10px; font-size: 0.88rem;
    }
    .rec-card {
      background: #0e151c; border: 1px solid var(--border); border-left-width: 4px;
      border-radius: 12px; padding: 0.7rem 0.8rem; margin-bottom: 0.45rem;
    }
    .rec-card.pri-critical { border-left-color: #ff6b6b; }
    .rec-card.pri-high { border-left-color: #f5a623; }
    .rec-card.pri-medium { border-left-color: #5b9fd4; }
    .rec-card.pri-low { border-left-color: #3a4550; }
    .rec-card.rank-1 { box-shadow: 0 0 0 1px rgba(255,107,107,0.2); }
    .rank-head {
      display: grid; grid-template-columns: auto 1fr auto; gap: 0.55rem; align-items: start;
    }
    .rank-badge {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 1.85rem; height: 1.85rem; border-radius: 999px;
      font-weight: 800; font-size: 0.9rem; border: 1px solid var(--border); background: #0a1016;
    }
    .rank-badge.r1 { color: #ff6b6b; border-color: #6b2e2e; background: #2a1515; }
    .rank-badge.r2 { color: #f5a623; border-color: #6b4a1e; background: #2a1f10; }
    .rank-badge.r3 { color: #5b9fd4; border-color: #2a4a66; background: #121c28; }
    .card-actions {
      display: flex; flex-wrap: wrap; gap: 0.35rem; margin-top: 0.4rem;
      padding-top: 0.4rem; border-top: 1px solid var(--border); align-items: center;
    }
    .detail { color: var(--muted); font-size: 0.86rem; }
    .id { color: var(--muted); font-size: 0.78rem; font-family: ui-monospace, Menlo, monospace; }
    details.more {
      margin-top: 1.25rem; border: 1px solid var(--border); border-radius: 12px;
      background: var(--panel); padding: 0.35rem 0.85rem 0.65rem;
    }
    details.more > summary {
      cursor: pointer; padding: 0.65rem 0.15rem; color: var(--muted);
      font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 700;
      list-style: none;
    }
    details.more > summary::-webkit-details-marker { display: none; }
    details.more[open] > summary { color: var(--accent); border-bottom: 1px solid var(--border); margin-bottom: 0.65rem; }
    .legend { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-top: 0.35rem; }
    .loop-legend {
      display: flex; flex-wrap: wrap; gap: 0.5rem 1rem; align-items: center;
      margin: 0 0 0.85rem; padding: 0.55rem 0.75rem; border-radius: 10px;
      background: #0e151c; border: 1px solid var(--border); font-size: 0.8rem; color: var(--muted);
    }
    .loop-legend strong { color: var(--text); font-weight: 650; }
    footer { margin-top: 1.5rem; color: var(--muted); font-size: 0.78rem; text-align: center; }
    .cmd {
      display: block; margin-top: 0.3rem; padding: 0.35rem 0.5rem;
      background: #0a1016; border-radius: 6px; border: 1px solid var(--border);
      font-family: ui-monospace, Menlo, monospace; font-size: 0.75rem; color: var(--blue);
      word-break: break-all;
    }
    .copy-btn { font-size: 0.72rem; padding: 0.2rem 0.45rem; margin-left: 0.3rem; }
    .view-toggle { display: flex; gap: 0.3rem; flex-wrap: wrap; }
    .view-toggle button.active { border-color: var(--accent); color: var(--accent); }
    .field {
      background: #0a1016; border: 1px solid var(--border); color: var(--text);
      border-radius: 8px; padding: 0.45rem 0.55rem; font-size: 0.85rem; width: 100%;
      font-family: inherit;
    }
    .live-dot {
      display: inline-block; width: 0.45rem; height: 0.45rem; border-radius: 999px;
      background: var(--green); margin-right: 0.35rem; box-shadow: 0 0 0 3px rgba(61,214,140,0.15);
    }
    .live-dot.off { background: var(--muted); box-shadow: none; }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <div>
        <h1>Autonomous Dev Loop</h1>
        <div class="sub">backlog → schedule → agent → PR → review</div>
      </div>
      <div class="header-meta" id="header-meta"></div>
    </div>
    <div class="actions">
      <span id="updated" class="sub"></span>
      <button type="button" id="btn-refresh">Refresh</button>
      <button type="button" id="btn-sync" title="Commit + push durable work">Protect &amp; push</button>
      <button type="button" id="btn-open-grok" class="btn-accent" title="Open Workflow Management Grok session">Open Grok</button>
    </div>
  </header>
  <main>
    <div id="err" class="error-banner" role="alert"></div>
    <div id="action-msg" class="error-banner" role="status"></div>

    <div class="loop-legend" id="loop-status">
      <span><span class="live-dot off" id="live-dot"></span><span id="live-label">Loading…</span></span>
    </div>

    <div class="pipeline" id="pipeline"></div>

    <div id="attention"></div>
    <div id="inflight"></div>
    <div id="backlog"></div>

    <details class="more" id="more-panel">
      <summary>More · suggestions, focus, system health, projects</summary>
      <div id="strategy-focus"></div>
      <div id="recommendations"></div>
      <div id="system"></div>
      <div id="branches"></div>
      <div id="list"></div>
      <div id="settings"></div>
    </details>

    <footer id="footer"></footer>
  </main>
  <script>
    const $ = (id) => document.getElementById(id);
    function esc(s) {
      return String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }
    function mdInline(s) {
      let t = String(s ?? "");
      t = t.replace(/\[([^\]]+)\]\([^)]+\)/g, "$1");
      t = esc(t);
      t = t.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      t = t.replace(/\*([^*\n]+)\*/g, "<em>$1</em>");
      return t;
    }
    function fmtWhen(iso) {
      if (!iso) return "—";
      try {
        const d = new Date(iso);
        if (Number.isNaN(d.getTime())) return esc(iso);
        return d.toLocaleString(undefined, { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
      } catch { return esc(iso); }
    }
    function copyText(text) {
      navigator.clipboard?.writeText(text).catch(() => {});
    }
    function priClass(p) {
      const x = (p || "medium").toLowerCase();
      return ["critical", "high", "medium", "low"].includes(x) ? x : "medium";
    }
    function jobStatusLabel(st) {
      const m = {
        queued: "queued",
        pending_terminal: "waiting Terminal",
        agent_running: "agent running",
        launched: "kicked off",
        running: "in progress",
        pr_ready: "PR ready",
        completed: "done",
        failed: "failed",
        cancelled: "cancelled",
      };
      return m[st] || st || "—";
    }
    function jobPill(st) {
      if (st === "pr_ready" || st === "completed") return "clean";
      if (st === "failed" || st === "pending_terminal") return "dirty";
      if (st === "agent_running" || st === "launched" || st === "running") return "session";
      return "muted";
    }

    window.__openChecks = window.__openChecks || new Set();
    window.__blEditOpen = window.__blEditOpen || new Set();
    window.__blView = window.__blView || "press";
    window.__recView = window.__recView || "press";

    function scrollToId(id) {
      const el = $(id);
      if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function render(data) {
      const r = data.readiness || {};
      const ws = data.workspace || {};
      const projects = data.projects || [];
      const br = data.branches || {};
      const sched = data.scheduler || {};
      const scfg = sched.config || {};
      const scron = sched.cron || {};
      const sjobs = sched.jobs || [];
      const sreports = sched.reports || [];
      const sauto = sched.auto_start_items || [];
      const spending = sched.pending_terminal_jobs || [];
      const sprs = sched.pr_ready_jobs || [];
      const snewprs = sched.new_prs_since_last_load || sprs.filter((j) => j.is_new_since_load);
      const sruntime = sched.runtime || {};
      const sexec = sched.execution || {};
      const loop = data.auto_loop || {};
      const backend = scfg.backend || "local";
      const execMode = scfg.execution_mode || sexec.mode || "auto";
      const bl = data.backlog || {};
      const blRanked = (bl.ranked || bl.items || []).filter((i) => !["done", "parked"].includes(i.status));

      const inProgress = sjobs.filter((j) =>
        ["agent_running", "launched", "running", "queued"].includes(j.status)
      );
      const waiting = sjobs.filter((j) => j.status === "pending_terminal");
      const prReady = sprs.length ? sprs : sjobs.filter((j) => j.status === "pr_ready");
      const recentDone = sjobs.filter((j) => ["completed", "failed"].includes(j.status)).slice(0, 5);
      const newPrCount = (snewprs && snewprs.length) ? snewprs.length : prReady.filter((j) => j.is_new_since_load).length;

      // Header
      $("header-meta").innerHTML = `
        <span class="pill branch">${esc(br.current || ws.branch || "—")}</span>
        <span class="pill ${ws.dirty ? "dirty" : "clean"}">${esc(ws.status_label || "—")}</span>
        <span class="pill ${backend === "raspi" ? "session" : "muted"}">${esc(backend)}</span>
        <span class="pill muted">${esc(execMode)}</span>
      `;

      // Live status line
      const lastTick = scfg.last_tick_at ? fmtWhen(scfg.last_tick_at) : "never";
      const lastRes = scfg.last_tick_result || {};
      const live = scfg.enabled && (backend === "raspi" || scron.installed);
      $("live-dot").className = "live-dot" + (live ? "" : " off");
      $("live-label").innerHTML = live
        ? `<strong>Loop on</strong> · ${esc(backend)} · last tick ${esc(lastTick)}`
          + (lastRes.pr_ready_count ? ` · ${esc(lastRes.pr_ready_count)} PR` : "")
          + (lastRes.launched_count ? ` · ${esc(lastRes.launched_count)} launched` : "")
          + (lastRes.pending_terminal_count ? ` · ${esc(lastRes.pending_terminal_count)} waiting` : "")
        : `<strong>Loop off</strong> · enable under Settings`;
      if (loop.claim && loop.claim.claimed_count) {
        $("live-label").innerHTML += ` · auto-claimed ${esc(loop.claim.claimed_count)}`;
      }

      // Pipeline strip
      $("pipeline").innerHTML = `
        <button type="button" class="pipe-stat ${sauto.length ? "has-alert" : ""}" data-jump="backlog">
          <div class="n" style="color:var(--green)">${sauto.length}</div>
          <div class="l">Queued</div>
          <div class="hint">auto-start · next tick</div>
        </button>
        <button type="button" class="pipe-stat ${inProgress.length || waiting.length ? "has-run" : ""}" data-jump="inflight">
          <div class="n" style="color:var(--purple)">${inProgress.length + waiting.length}</div>
          <div class="l">In progress</div>
          <div class="hint">${inProgress.length} running · ${waiting.length} waiting</div>
        </button>
        <button type="button" class="pipe-stat ${prReady.length ? "has-alert" : ""}" data-jump="attention">
          <div class="n" style="color:${prReady.length ? "var(--green)" : "var(--muted)"}">${prReady.length}</div>
          <div class="l">PRs to review</div>
          <div class="hint">${newPrCount ? newPrCount + " new since last load" : "open & merge"}</div>
        </button>
        <button type="button" class="pipe-stat" data-jump="backlog">
          <div class="n" style="color:var(--accent)">${blRanked.length}</div>
          <div class="l">Backlog</div>
          <div class="hint">active ideas / ready</div>
        </button>
      `;

      // —— Attention: PRs ——
      const prList = (snewprs && snewprs.length ? snewprs : prReady).slice(0, 12);
      $("attention").innerHTML = `
        <div class="section-title" id="attention-title">Needs review <span class="sub">· agent finished · open PR · approve or request changes</span></div>
        <div class="card">
          ${!prList.length
            ? `<div class="empty">No PRs waiting. When the Pi finishes a job you’ll see it here with a Review link.</div>`
            : prList.map((j) => `
              <div class="sess">
                <div><span class="pill ${j.is_new_since_load === false ? "muted" : "clean"}">${j.is_new_since_load === false ? "PR" : "NEW PR"}</span></div>
                <div>
                  <div class="title">${esc(j.title)}</div>
                  <div class="id">
                    ${esc(j.branch || "")}${j.pr_number != null ? ` · #${esc(j.pr_number)}` : ""}
                    · ${esc(fmtWhen(j.pr_ready_at || j.created_at))}
                    ${j.pr_url ? ` · <a href="${esc(j.pr_url)}" target="_blank" rel="noopener">open on GitHub</a>` : ""}
                  </div>
                </div>
                <div style="display:flex;flex-direction:column;gap:0.3rem;align-items:flex-end">
                  ${j.pr_url ? `<a class="btn-kick" style="display:inline-block;padding:0.35rem 0.65rem;text-decoration:none;border:1px solid var(--border);border-radius:8px;font-weight:650;font-size:0.82rem" href="${esc(j.pr_url)}" target="_blank" rel="noopener">Review PR</a>` : ""}
                  <button type="button" class="btn-job-complete" data-id="${esc(j.id)}" title="Mark done after you merge">Mark done</button>
                </div>
              </div>`).join("")}
          <div class="detail" style="margin-top:0.55rem">
            How you’ll know: <strong>NEW PR</strong> badges appear after a Pi tick opens a pull request.
            Auto-refresh every 45s while this page is open.
          </div>
        </div>`;

      // —— In flight ——
      const flight = [...inProgress, ...waiting].slice(0, 15);
      $("inflight").innerHTML = `
        <div class="section-title" id="inflight-title">Kicked off &amp; in progress <span class="sub">· agent running · Terminal · waiting</span></div>
        <div class="card">
          ${!flight.length
            ? `<div class="empty">Nothing in flight. Queued work starts on the next Pi tick (~15 min) or via Run tick in Settings.</div>`
            : flight.map((j) => `
              <div class="sess">
                <div><span class="pill ${jobPill(j.status)}">${esc(jobStatusLabel(j.status))}</span></div>
                <div>
                  <div class="title">${esc(j.title)}</div>
                  <div class="id">
                    ${esc(j.id)}
                    ${j.branch ? ` · ${esc(j.branch)}` : ""}
                    · ${esc(fmtWhen(j.started_at || j.launched_at || j.pending_at || j.created_at))}
                    ${j.pr_url ? ` · <a href="${esc(j.pr_url)}" target="_blank">PR</a>` : ""}
                    ${j.error ? ` · ${esc(j.error)}` : ""}
                  </div>
                </div>
                <div class="when">${esc(j.backend || "")}</div>
              </div>`).join("")}
          ${sauto.length ? `
            <h3 style="margin:0.85rem 0 0.35rem;font-size:0.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em">Queued for next tick</h3>
            ${sauto.map((a) => `
              <div class="sess">
                <div><span class="pill auto-on">queued</span></div>
                <div>
                  <div class="title">${esc(a.title)}</div>
                  <div class="id">#${esc(a.press_rank || "—")} · ${esc(a.schedule_slot || "")} · ${esc(a.status)}</div>
                </div>
                <div><button type="button" class="btn-bl-auto-off" data-id="${esc(a.id)}">Unqueue</button></div>
              </div>`).join("")}
          ` : ""}
          ${recentDone.length ? `
            <h3 style="margin:0.85rem 0 0.35rem;font-size:0.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em">Recent finished</h3>
            ${recentDone.map((j) => `
              <div class="sess">
                <div><span class="pill ${jobPill(j.status)}">${esc(jobStatusLabel(j.status))}</span></div>
                <div>
                  <div class="title">${esc(j.title)}</div>
                  <div class="id">${esc(fmtWhen(j.completed_at || j.finished_at || j.created_at))}${j.pr_url ? ` · <a href="${esc(j.pr_url)}" target="_blank">PR</a>` : ""}</div>
                </div>
                <div></div>
              </div>`).join("")}
          ` : ""}
        </div>`;

      // —— Backlog ——
      const fieldStyle = "background:#0a1016;border:1px solid var(--border);color:var(--text);border-radius:8px;padding:0.4rem 0.55rem;font-size:0.85rem;width:100%;font-family:inherit;box-sizing:border-box";
      function renderBlCard(it) {
        const pri = priClass(it.priority);
        const rank = it.press_rank || "—";
        const editing = window.__blEditOpen.has(it.id);
        const priOpts = ["low", "medium", "high", "critical"].map((p) =>
          `<option value="${p}"${(it.priority || "medium") === p ? " selected" : ""}>${p}</option>`
        ).join("");
        return `
          <article class="rec-card pri-${pri}${rank === 1 ? " rank-1" : ""}" data-bl-id="${esc(it.id)}">
            <div class="rank-head">
              <div class="rank-badge ${rank === 1 ? "r1" : rank === 2 ? "r2" : rank === 3 ? "r3" : ""}">#${rank}</div>
              <div>
                <div style="display:flex;flex-wrap:wrap;gap:0.3rem;align-items:center">
                  <span class="title" style="font-weight:650">${esc(it.title)}</span>
                  ${it.schedule_label ? `<span class="pill branch">${esc(it.schedule_label)}</span>` : ""}
                  ${it.auto_start ? `<span class="pill auto-on">queued</span>` : ""}
                </div>
                ${!editing && it.mvp_scope ? `<div class="id" style="margin-top:0.2rem">MVP: ${esc(it.mvp_scope)}</div>` : ""}
                ${!editing && it.description ? `<div class="detail" style="margin-top:0.2rem">${esc(it.description.slice(0, 160))}${it.description.length > 160 ? "…" : ""}</div>` : ""}
              </div>
              <div style="display:flex;flex-direction:column;gap:0.25rem;align-items:flex-end">
                <span class="pill pri-${pri}">${esc(it.priority || "medium")}</span>
                <span class="pill muted">${esc(it.status)}</span>
              </div>
            </div>
            ${editing ? `
              <div class="bl-edit" style="display:grid;gap:0.4rem;margin-top:0.5rem;padding-top:0.5rem;border-top:1px solid var(--border)">
                <label class="id">Title<input class="bl-edit-title field" style="margin-top:0.2rem" value="${esc(it.title)}" /></label>
                <label class="id">Description<textarea class="bl-edit-desc field" rows="2" style="margin-top:0.2rem">${esc(it.description || "")}</textarea></label>
                <label class="id">MVP<input class="bl-edit-mvp field" style="margin-top:0.2rem" value="${esc(it.mvp_scope || "")}" /></label>
                <label class="id">Notes<textarea class="bl-edit-notes field" rows="2" style="margin-top:0.2rem">${esc(it.notes || "")}</textarea></label>
                <div style="display:flex;flex-wrap:wrap;gap:0.4rem">
                  <select class="bl-edit-priority field" style="width:auto">${priOpts}</select>
                  <input class="bl-edit-area field" style="width:9rem" value="${esc(it.area || "")}" placeholder="area" />
                  <button type="button" class="btn-bl-save" data-id="${esc(it.id)}">Save</button>
                  <button type="button" class="btn-bl-cancel-edit" data-id="${esc(it.id)}">Cancel</button>
                </div>
              </div>
            ` : ""}
            <div class="card-actions">
              <button type="button" class="btn-bl-auto ${it.auto_start ? "btn-accent on" : "btn-accent"}" data-id="${esc(it.id)}" title="Queue for autonomous Pi kickoff">${it.auto_start ? "★ Queued" : "★ Queue for agent"}</button>
              <button type="button" class="btn-bl-edit" data-id="${esc(it.id)}">${editing ? "Hide" : "Edit"}</button>
              <button type="button" class="btn-bl-done" data-id="${esc(it.id)}">Done</button>
              <button type="button" class="btn-bl-park" data-id="${esc(it.id)}">Park</button>
              <button type="button" class="btn-bl-del" data-id="${esc(it.id)}">Delete</button>
            </div>
          </article>`;
      }
      const top = blRanked.filter((i) => (i.press_rank || 99) <= 5);
      const rest = blRanked.filter((i) => !top.includes(i));
      $("backlog").innerHTML = `
        <div class="section-title" id="backlog-title">Backlog <span class="sub">· add work · queue for agent · auto-groomed on load</span></div>
        <div class="card">
          <div style="display:grid;gap:0.4rem;margin-bottom:0.75rem">
            <input id="bl-title" class="field" placeholder="New work — what should the agent build?" />
            <input id="bl-mvp" class="field" placeholder="MVP (optional) — smallest shippable slice" />
            <div style="display:flex;flex-wrap:wrap;gap:0.4rem;align-items:center">
              <select id="bl-priority" class="field" style="width:auto">
                <option value="medium">medium</option>
                <option value="high">high</option>
                <option value="critical">critical</option>
                <option value="low">low</option>
              </select>
              <input id="bl-area" class="field" style="width:9rem" placeholder="area" />
              <button type="button" id="btn-bl-add" class="btn-accent">Add</button>
            </div>
            <textarea id="bl-desc" class="field" rows="1" placeholder="Description (optional)" style="display:none"></textarea>
          </div>
          ${!blRanked.length
            ? `<div class="empty">Backlog empty — add a task above. It will be groomed and can be queued for the Pi agent.</div>`
            : `${top.map(renderBlCard).join("")}${rest.length ? rest.map(renderBlCard).join("") : ""}`}
        </div>`;

      // —— Secondary: today's focus ——
      const sf = data.strategy_focus || {};
      const openFocus = sf.open_items || [];
      $("strategy-focus").innerHTML = openFocus.length ? `
        <div class="section-title">Today's focus</div>
        <div class="card">
          <ul style="margin:0;padding-left:1.1rem">
            ${openFocus.slice(0, 6).map((t) => `<li style="margin:0.3rem 0">${mdInline(t)}</li>`).join("")}
          </ul>
        </div>` : "";

      // Recommendations (compact)
      const rec = data.recommendations || {};
      const ranked = rec.ranked || rec.pending || [];
      $("recommendations").innerHTML = ranked.length ? `
        <div class="section-title">Suggestions</div>
        <div class="card">
          ${ranked.slice(0, 4).map((s) => `
            <div class="sess">
              <div><span class="pill pri-${priClass(s.priority)}">${esc(s.priority || "")}</span></div>
              <div><div class="title">${esc(s.title)}</div><div class="id">${esc((s.rationale || "").slice(0, 100))}</div></div>
              <div style="display:flex;gap:0.3rem">
                <button type="button" class="btn-rec-approve" data-id="${esc(s.id)}">Add</button>
                <button type="button" class="btn-rec-reject" data-id="${esc(s.id)}">Skip</button>
              </div>
            </div>`).join("")}
          <button type="button" id="btn-rec-refresh" style="margin-top:0.45rem">Refresh suggestions</button>
        </div>` : `
        <div class="section-title">Suggestions</div>
        <div class="card"><div class="empty">No suggestions · <button type="button" id="btn-rec-refresh">Refresh</button></div></div>`;

      // System health compact
      const c = r.counts || {};
      $("system").innerHTML = `
        <div class="section-title">System</div>
        <div class="card">
          <div class="legend">
            <span class="pill ${ws.dirty ? "dirty" : "clean"}">git ${esc(ws.status_label || "—")}</span>
            <span class="pill muted">dirty files ${esc(c.dirty_files ?? 0)}</span>
            <span class="pill muted">sessions ${esc(c.persisted_sessions ?? 0)}</span>
            <span class="pill muted">servers ${esc(c.listeners ?? 0)}</span>
          </div>
          <div class="detail" style="margin-top:0.45rem">Grok on this host: ${sruntime.has_grok ? "yes" : "no"} · Pi agent: ${sexec.use_agent || backend === "raspi" ? "preferred" : "—"} · last tick ${esc(lastTick)}</div>
        </div>`;

      // Branches compact
      const branchList = (br.branches || []).filter((b) => b.current || b.is_work).slice(0, 8);
      $("branches").innerHTML = branchList.length ? `
        <div class="section-title">Branches</div>
        <div class="card">
          ${branchList.map((b) => `
            <div class="sess">
              <div>${b.current ? `<span class="pill active">HEAD</span>` : `<span class="pill session">work</span>`}</div>
              <div><div class="title">${esc(b.name)}</div><div class="id">${esc(b.sha || "")}</div></div>
              <div></div>
            </div>`).join("")}
        </div>` : "";

      // Projects
      if (!projects.length) {
        $("list").innerHTML = "";
      } else {
        $("list").innerHTML = `
          <div class="section-title">Project areas</div>
          ${projects.slice(0, 8).map((p) => `
            <div class="card" style="padding:0.65rem 0.85rem">
              <div style="display:flex;justify-content:space-between;gap:0.5rem;flex-wrap:wrap">
                <strong>${esc(p.name)}</strong>
                <span class="pill ${p.dirty ? "dirty" : "clean"}">${esc(p.status_label)}</span>
              </div>
            </div>`).join("")}`;
      }

      // Settings
      $("settings").innerHTML = `
        <div class="section-title">Loop settings</div>
        <div class="card">
          <div style="display:flex;flex-wrap:wrap;gap:0.45rem;align-items:center">
            <label class="id">Backend
              <select id="sched-backend" class="field" style="width:auto;display:inline-block;margin-left:0.25rem">
                <option value="local"${backend === "local" ? " selected" : ""}>local</option>
                <option value="raspi"${backend === "raspi" ? " selected" : ""}>raspi (24/7)</option>
              </select>
            </label>
            <label class="id">Exec
              <select id="sched-exec" class="field" style="width:auto;display:inline-block;margin-left:0.25rem">
                <option value="auto"${execMode === "auto" ? " selected" : ""}>auto</option>
                <option value="agent"${execMode === "agent" ? " selected" : ""}>agent → PR</option>
                <option value="queue"${execMode === "queue" ? " selected" : ""}>queue Terminal</option>
                <option value="spawn"${execMode === "spawn" ? " selected" : ""}>spawn Grok</option>
              </select>
            </label>
            <button type="button" id="btn-sched-enable">${scfg.enabled ? "Disable loop" : "Enable loop"}</button>
            <button type="button" id="btn-sched-tick" class="btn-kick">Run tick now</button>
            <button type="button" id="btn-sched-claim">Claim pending</button>
            <button type="button" id="btn-session-index">Session index</button>
          </div>
          <div class="id" style="margin-top:0.5rem">
            ${esc(sched.note || "")}
            ${scfg.last_tick_at ? `<br/>Last tick ${esc(fmtWhen(scfg.last_tick_at))}` : ""}
          </div>
        </div>`;

      $("footer").textContent = "Autonomous loop: enter work → groom/queue → Pi agent → PR review here → merge on GitHub";
      $("updated").textContent = `Updated ${new Date().toLocaleTimeString()}`;

      document.querySelectorAll("[data-copy]").forEach((btn) => {
        btn.addEventListener("click", () => copyText(btn.getAttribute("data-copy") || ""));
      });
      document.querySelectorAll("[data-jump]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const j = btn.getAttribute("data-jump");
          if (j === "attention") scrollToId("attention");
          else if (j === "inflight") scrollToId("inflight");
          else if (j === "backlog") scrollToId("backlog");
        });
      });
    }

    let dataCache = null;
    window.__topToast = null;

    function setTopToast(msg, isErr) {
      window.__topToast = { msg: String(msg || ""), err: !!isErr, at: Date.now() };
    }
    function applyTopToast() {
      const t = window.__topToast;
      if (!$("action-msg")) return;
      $("action-msg").classList.remove("show");
      $("action-msg").textContent = "";
      if (!t || !t.msg) return;
      $("action-msg").textContent = t.msg;
      $("action-msg").classList.add("show");
      if (t.err) {
        $("err").textContent = t.msg;
        $("err").classList.add("show");
      }
    }
    function maybeToastAutoLoop(loop, sched) {
      if (!loop) return;
      if (loop.error) { setTopToast(`Auto-loop: ${loop.error}`, true); return; }
      const parts = [];
      if (loop.claim && loop.claim.claimed_count) {
        parts.push(loop.claim.message || `Auto-claimed ${loop.claim.claimed_count}`);
      }
      const rec = loop.reconcile || {};
      if (rec.merged) parts.push(`${rec.merged} PR(s) merged → done`);
      if (rec.orphaned) parts.push(`cleared ${rec.orphaned} stale job(s)`);
      const newPrs = (sched && sched.new_prs_since_last_load) || [];
      if (newPrs.length) parts.push(`${newPrs.length} new PR(s) ready for review`);
      // Quiet: skip pure groom noise unless something actionable happened
      if (!parts.length) return;
      const msg = parts.join(" · ");
      if (window.__topToast && window.__topToast.msg && (Date.now() - (window.__topToast.at || 0)) < 8000) return;
      setTopToast(msg, false);
    }

    async function load() {
      const btn = $("btn-refresh");
      if (btn) btn.disabled = true;
      $("err").classList.remove("show");
      try {
        const res = await fetch(`/api/projects?only_touched=1`, { cache: "no-store" });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || "API error");
        dataCache = data;
        render(data);
        maybeToastAutoLoop(data.auto_loop || {}, data.scheduler || {});
        applyTopToast();
      } catch (e) {
        $("err").textContent = `Failed to load: ${e.message}`;
        $("err").classList.add("show");
      } finally {
        if (btn) btn.disabled = false;
      }
    }

    async function postAction(url, body) {
      $("action-msg").classList.remove("show");
      $("err").classList.remove("show");
      try {
        const res = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body || {}),
        });
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || JSON.stringify(data));
        let msg = data.message
          || (data.committed ? `Committed ${data.sha || ""}` : "OK")
          + (data.pushed ? " · pushed" : "");
        if (data.steps) {
          msg = data.steps.map((s) => {
            const body = s.ok
              ? (s.committed ? `committed ${s.sha || ""}` : (s.message || "ok"))
              : (s.error || "fail");
            return `${s.step}:${body}`;
          }).join(" · ");
          if (data.steps.some((s) => s.ok === false)) throw new Error(msg);
        }
        if (data.goal_objective) {
          msg = `Initiated · ${data.seed_path || ""}`;
          copyText(data.goal_objective);
        }
        if (data.item && data.item.title && !data.goal_objective) msg = `Saved: ${data.item.title}`;
        if (data.groomed_at || data.applied || (url.includes("/api/backlog/groom"))) {
          msg = data.message || `Groomed ${data.count ?? ""} items`;
        }
        if (data.launched_count != null || data.ticked_at || data.pending_terminal_count != null || data.pr_ready_count != null) {
          msg = data.message || `Tick: launched ${data.launched_count ?? 0}, PRs ${data.pr_ready_count ?? 0}`;
        }
        if (data.claimed_count != null) msg = data.message || `Claimed ${data.claimed_count}`;
        if (data.auto_start != null) {
          msg = data.auto_start ? `Queued for agent: ${data.item?.title || "item"}` : "Unqueued";
        }
        if (data.job && data.report) msg = `Job ${data.job.status}: ${data.report.summary || ""}`;
        if (url.includes("/api/open-grok")) msg = data.message || "Opened Grok";
        setTopToast(msg, false);
        await load();
      } catch (e) {
        setTopToast(e.message, true);
        applyTopToast();
        $("err").textContent = e.message;
        $("err").classList.add("show");
      }
    }

    $("btn-refresh").addEventListener("click", load);
    $("btn-sync").addEventListener("click", () => postAction("/api/sync", {}));
    $("btn-open-grok").addEventListener("click", () => postAction("/api/open-grok", { mode: "named" }));

    document.addEventListener("change", async (ev) => {
      const t = ev.target;
      if (!t) return;
      if (t.id === "sched-backend") await postAction("/api/scheduler/config", { backend: t.value });
      if (t.id === "sched-exec") await postAction("/api/scheduler/config", { execution_mode: t.value });
    });

    document.addEventListener("click", async (ev) => {
      const t = ev.target;
      if (!t) return;
      if (t.id === "btn-bl-add") {
        const title = ($("bl-title") && $("bl-title").value) || "";
        if (!title.trim()) {
          $("err").textContent = "Title required";
          $("err").classList.add("show");
          return;
        }
        await postAction("/api/backlog", {
          title: title.trim(),
          description: ($("bl-desc") && $("bl-desc").value) || "",
          mvp_scope: ($("bl-mvp") && $("bl-mvp").value) || "",
          priority: ($("bl-priority") && $("bl-priority").value) || "medium",
          area: ($("bl-area") && $("bl-area").value) || "",
          status: "idea",
        });
        if ($("bl-title")) $("bl-title").value = "";
        if ($("bl-mvp")) $("bl-mvp").value = "";
        return;
      }
      if (t.id === "btn-sched-enable") {
        const enable = (t.textContent || "").toLowerCase().includes("enable");
        await postAction("/api/scheduler/config", { enabled: enable });
        return;
      }
      if (t.id === "btn-sched-tick") {
        await postAction("/api/scheduler/tick", { force: true });
        return;
      }
      if (t.id === "btn-sched-claim") {
        await postAction("/api/scheduler/claim", { max_jobs: 3 });
        return;
      }
      if (t.id === "btn-session-index") {
        await postAction("/api/session-index", {});
        return;
      }
      if (t.id === "btn-rec-refresh") {
        await postAction("/api/recommendations/refresh", {});
        return;
      }

      const id = t.getAttribute && t.getAttribute("data-id");
      if (!id) return;
      if (t.classList.contains("btn-rec-approve")) {
        await postAction("/api/recommendations/approve", { id });
        return;
      }
      if (t.classList.contains("btn-rec-reject")) {
        await postAction("/api/recommendations/reject", { id });
        return;
      }
      if (t.classList.contains("btn-bl-edit")) {
        if (window.__blEditOpen.has(id)) window.__blEditOpen.delete(id);
        else window.__blEditOpen.add(id);
        load();
        return;
      }
      if (t.classList.contains("btn-bl-cancel-edit")) {
        window.__blEditOpen.delete(id);
        load();
        return;
      }
      if (t.classList.contains("btn-bl-save")) {
        const root = t.closest("[data-bl-id]") || t.closest(".rec-card");
        if (!root) return;
        const title = (root.querySelector(".bl-edit-title") || {}).value || "";
        if (!String(title).trim()) return;
        await postAction("/api/backlog/update", {
          id,
          title: String(title).trim(),
          description: (root.querySelector(".bl-edit-desc") || {}).value || "",
          mvp_scope: (root.querySelector(".bl-edit-mvp") || {}).value || "",
          notes: (root.querySelector(".bl-edit-notes") || {}).value || "",
          priority: (root.querySelector(".bl-edit-priority") || {}).value || "medium",
          area: (root.querySelector(".bl-edit-area") || {}).value || "",
        });
        window.__blEditOpen.delete(id);
        return;
      }
      if (t.classList.contains("btn-bl-auto") || t.classList.contains("btn-bl-auto-off")) {
        const turnOn = t.classList.contains("btn-bl-auto")
          && !(t.textContent || "").includes("Queued");
        await postAction("/api/scheduler/auto-start", { id, enabled: turnOn });
        return;
      }
      if (t.classList.contains("btn-job-complete")) {
        await postAction("/api/scheduler/complete", {
          job_id: id,
          summary: "Marked complete from dashboard",
          status: "completed",
        });
        return;
      }
      if (t.classList.contains("btn-job-claim")) {
        await postAction("/api/scheduler/claim", { job_id: id, max_jobs: 1 });
        return;
      }
      if (t.classList.contains("btn-bl-done")) {
        await postAction("/api/backlog/update", { id, status: "done" });
        return;
      }
      if (t.classList.contains("btn-bl-park")) {
        await postAction("/api/backlog/update", { id, status: "parked" });
        return;
      }
      if (t.classList.contains("btn-bl-del")) {
        if (!confirm("Delete this backlog item?")) return;
        await postAction("/api/backlog/delete", { id });
      }
    });

    load();
    // Auto-refresh so PR/in-progress state stays current without manual reloads
    setInterval(() => {
      if (document.visibilityState === "visible") load();
    }, 45000);
  </script>
</body>
</html>
