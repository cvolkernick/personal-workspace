<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Time Allocator — Rolling 24h</title>
  <style>
    :root {
      --bg: #0b0f14;
      --panel: #121a22;
      --border: #1e2a36;
      --text: #e7eef5;
      --muted: #8aa0b5;
      --green: #3dd68c;
      --yellow: #f5c542;
      --red: #ff6b6b;
      --accent: #5b9fd4;
      --bar: #3a7ebd;
      --fill: #7c9cff;
      --reserve: #6b7c8f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: radial-gradient(1200px 600px at 10% -10%, #152033 0%, var(--bg) 55%);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.45;
    }
    header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: center;
      justify-content: space-between;
    }
    header h1 { margin: 0; font-size: 1.35rem; font-weight: 650; letter-spacing: -0.02em; }
    header .sub { color: var(--muted); font-size: 0.9rem; }
    main {
      max-width: 1040px;
      margin: 0 auto;
      padding: 1.25rem 1.5rem 3rem;
      display: grid;
      gap: 1rem;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem 1.1rem;
    }
    .card h2 {
      margin: 0 0 0.75rem;
      font-size: 0.95rem;
      color: var(--muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .stats { display: flex; flex-wrap: wrap; gap: 0.75rem; }
    .stat {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.65rem 0.9rem;
      min-width: 7rem;
    }
    .stat .label { color: var(--muted); font-size: 0.75rem; text-transform: uppercase; }
    .stat .value { font-size: 1.2rem; font-weight: 650; margin-top: 0.15rem; }
    .row { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }
    label { color: var(--muted); font-size: 0.85rem; }
    input, select, button, textarea {
      font: inherit;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      padding: 0.45rem 0.65rem;
    }
    input[type="number"] { width: 5.5rem; }
    input[type="text"], input[type="date"] { min-width: 10rem; }
    button {
      cursor: pointer;
      background: #1a2836;
      font-weight: 600;
    }
    button:hover { border-color: var(--accent); color: var(--accent); }
    button.primary {
      background: #1e3a55;
      border-color: #2a5a80;
      color: #cfe6ff;
    }
    button.danger:hover { border-color: var(--red); color: var(--red); }
    table { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
    th, td {
      text-align: left;
      padding: 0.55rem 0.4rem;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }
    th {
      color: var(--muted);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      font-weight: 600;
    }
    .kind, .role, .pill {
      display: inline-block;
      padding: 0.1rem 0.45rem;
      border-radius: 999px;
      font-size: 0.75rem;
      border: 1px solid var(--border);
      color: var(--muted);
    }
    .role.reserve { color: var(--reserve); }
    .role.fixed, .role.session { color: var(--yellow); border-color: #6b5a1e; }
    .role.adhoc { color: var(--accent); border-color: #2a4a66; }
    .role.fill { color: var(--fill); border-color: #3d4a80; }
    .pill.ok { color: var(--green); border-color: #245c42; }
    .pill.bad { color: var(--red); border-color: #6b2e2e; }
    .pill.na { color: var(--muted); }
    .bar-wrap {
      height: 10px;
      background: #0a121a;
      border-radius: 5px;
      overflow: hidden;
      display: flex;
      width: 100%;
      margin-top: 0.5rem;
    }
    .bar-seg { height: 100%; min-width: 1px; }
    .bar-seg.reserve { background: #4a5568; }
    .bar-seg.fixed, .bar-seg.session { background: #c9a227; }
    .bar-seg.adhoc { background: var(--accent); }
    .bar-seg.fill { background: var(--fill); }
    .msg { min-height: 1.25rem; color: var(--muted); font-size: 0.9rem; }
    .msg.error { color: var(--red); }
    .msg.ok { color: var(--green); }
    .empty { color: var(--muted); padding: 0.75rem 0; }
    .path { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.78rem; word-break: break-all; color: var(--muted); }
    .notes { margin: 0.5rem 0 0; padding-left: 1.1rem; color: var(--muted); font-size: 0.88rem; }
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1rem;
    }
    .actions { display: flex; gap: 0.35rem; flex-wrap: wrap; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Time Allocator</h1>
      <div class="sub">Rolling 24h balance · ongoing targets + ad-hoc tasks</div>
    </div>
    <div class="row">
      <button type="button" id="btn-refresh">Refresh</button>
      <button type="button" class="primary" id="btn-plan">Rebuild 24h plan</button>
      <button type="button" id="btn-seed">Reset personal targets</button>
    </div>
  </header>
  <main>
    <section class="card">
      <h2>Rolling 24h plan</h2>
      <div class="stats" id="plan-stats"></div>
      <div class="bar-wrap" id="plan-bar" title="Window composition"></div>
      <div id="plan-table"></div>
      <ul class="notes" id="plan-notes"></ul>
      <p class="msg" id="status-msg"></p>
      <p class="path" id="data-path"></p>
    </section>

    <section class="card">
      <h2>Ongoing targets &amp; KPIs</h2>
      <div id="kpi-wrap"><p class="empty">Loading…</p></div>
      <form id="log-form" class="row" style="margin-top: 0.85rem;">
        <label>Log
          <select id="log-target"></select>
        </label>
        <label>value <input type="number" id="log-value" step="0.1" value="1" /></label>
        <label>date <input type="date" id="log-date" /></label>
        <input type="text" id="log-note" placeholder="note (optional)" style="flex:1;min-width:8rem" />
        <button type="submit" class="primary">Log</button>
      </form>
      <p class="path" style="margin-top:0.5rem">
        Sleep → hours (e.g. 7.5). Workout → 1 if done. Duchess → minutes walked. Lyft can be hours driven later.
      </p>
    </section>

    <section class="card">
      <h2>Ad-hoc tasks / goals</h2>
      <form id="add-form" class="row">
        <input type="text" id="add-title" placeholder="Something to fit into the next 24h" required style="flex:1" />
        <select id="add-kind">
          <option value="task">task</option>
          <option value="goal">goal</option>
        </select>
        <label>pri <input type="number" id="add-priority" value="5" min="0" max="20" /></label>
        <label>min <input type="number" id="add-minutes" value="30" min="0" step="5" /></label>
        <button type="submit" class="primary">Add</button>
      </form>
      <div id="list-wrap" style="margin-top:0.75rem"></div>
    </section>
  </main>
  <script>
    const $ = (id) => document.getElementById(id);
    const msg = (text, kind) => {
      const el = $("status-msg");
      el.textContent = text || "";
      el.className = "msg" + (kind ? " " + kind : "");
    };
    const escapeHtml = (s) => String(s ?? "")
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    const escapeAttr = (s) => escapeHtml(s).replace(/'/g, "&#39;");
    const hours = (min) => {
      const m = Number(min) || 0;
      const h = Math.floor(m / 60);
      const r = m % 60;
      if (h === 0) return `${m}m`;
      return r ? `${h}h ${r}m` : `${h}h`;
    };

    async function api(path, opts) {
      const res = await fetch(path, {
        headers: { "Content-Type": "application/json", ...(opts && opts.headers) },
        ...opts,
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || data.ok === false) {
        throw new Error(data.error || res.statusText || "request failed");
      }
      return data;
    }

    function trackPill(onTrack) {
      if (onTrack === true) return `<span class="pill ok">on track</span>`;
      if (onTrack === false) return `<span class="pill bad">behind</span>`;
      return `<span class="pill na">n/a</span>`;
    }

    function renderPlan(plan) {
      if (!plan) {
        $("plan-stats").innerHTML = "";
        $("plan-table").innerHTML = `<p class="empty">No plan yet.</p>`;
        $("plan-bar").innerHTML = "";
        $("plan-notes").innerHTML = "";
        return;
      }
      const blocks = plan.blocks || [];
      $("plan-stats").innerHTML = `
        <div class="stat"><div class="label">Window</div><div class="value">${hours(plan.window_minutes)}</div></div>
        <div class="stat"><div class="label">Sleep reserve</div><div class="value">${hours(plan.sleep_reserve_minutes)}</div></div>
        <div class="stat"><div class="label">Active</div><div class="value">${hours(plan.active_minutes)}</div></div>
        <div class="stat"><div class="label">Blocks</div><div class="value">${blocks.length}</div></div>
      `;
      const w = Math.max(plan.window_minutes || 1, 1);
      $("plan-bar").innerHTML = blocks.map((b) => {
        const pct = Math.max(0.4, (Number(b.minutes) / w) * 100);
        const role = escapeAttr(b.role || "adhoc");
        return `<div class="bar-seg ${role}" style="width:${pct}%" title="${escapeAttr(b.title)}: ${b.minutes}m"></div>`;
      }).join("");

      if (!blocks.length) {
        $("plan-table").innerHTML = `<p class="empty">Empty plan — seed targets or rebuild.</p>`;
      } else {
        $("plan-table").innerHTML = `
          <table>
            <thead><tr>
              <th>Block</th><th>Role</th><th>Min</th><th>Share of 24h</th><th></th>
            </tr></thead>
            <tbody>
              ${blocks.map((b) => {
                const pct = Math.round(((Number(b.minutes) || 0) / w) * 100);
                return `<tr>
                  <td><strong>${escapeHtml(b.title)}</strong>
                    <div class="path">${escapeHtml(b.source)}:${escapeHtml(b.id)}${b.reason ? " · " + escapeHtml(b.reason) : ""}${b.soft_estimate ? " · soft 30m estimate" : ""}</div>
                  </td>
                  <td><span class="role ${escapeAttr(b.role)}">${escapeHtml(b.role)}</span></td>
                  <td>${b.minutes} <span class="path">(${hours(b.minutes)})</span></td>
                  <td>
                    <div class="bar-wrap" style="margin:0"><div class="bar-seg ${escapeAttr(b.role)}" style="width:${pct}%"></div></div>
                    <div class="path">${pct}%</div>
                  </td>
                  <td class="path">${escapeHtml(b.kind || "")}</td>
                </tr>`;
              }).join("")}
            </tbody>
          </table>`;
      }
      const notes = plan.notes || [];
      $("plan-notes").innerHTML = notes.map((n) => `<li>${escapeHtml(n)}</li>`).join("");
    }

    function renderKpis(state) {
      const kpis = state.kpi_status || [];
      const targets = state.targets || [];
      const sel = $("log-target");
      const prev = sel.value;
      sel.innerHTML = targets.map((t) =>
        `<option value="${escapeAttr(t.id)}">${escapeHtml(t.title)} (${escapeHtml(t.kind)})</option>`
      ).join("");
      if (prev) sel.value = prev;

      if (!kpis.length) {
        $("kpi-wrap").innerHTML = `<p class="empty">No ongoing targets — click “Reset personal targets”.</p>`;
        return;
      }
      $("kpi-wrap").innerHTML = `
        <table>
          <thead><tr><th>Target</th><th>Status</th><th>Summary</th><th></th></tr></thead>
          <tbody>
            ${kpis.map((k) => `
              <tr>
                <td><strong>${escapeHtml(k.title)}</strong>
                  <div class="path">${escapeHtml(k.id)} · ${escapeHtml(k.kind)} · pri ${k.priority}</div>
                </td>
                <td>${trackPill(k.on_track)}</td>
                <td>${escapeHtml(k.summary)}</td>
                <td class="actions">
                  <button type="button" class="btn-rm-target danger" data-id="${escapeAttr(k.id)}">Remove</button>
                </td>
              </tr>`).join("")}
          </tbody>
        </table>`;
      $("kpi-wrap").querySelectorAll(".btn-rm-target").forEach((btn) => {
        btn.addEventListener("click", async () => {
          if (!confirm(`Remove target ${btn.dataset.id}?`)) return;
          try {
            const next = await api("/api/targets/remove", {
              method: "POST",
              body: JSON.stringify({ key: btn.dataset.id }),
            });
            msg(`Removed target ${btn.dataset.id}`, "ok");
            render(next);
          } catch (e) {
            msg(String(e.message || e), "error");
          }
        });
      });
    }

    function renderItems(state) {
      const items = state.items || [];
      const wrap = $("list-wrap");
      if (!items.length) {
        wrap.innerHTML = `<p class="empty">No ad-hoc items — add errands, deep work, etc. They take priority after fixed targets; leftover active time goes to Lyft.</p>`;
        return;
      }
      wrap.innerHTML = `
        <table>
          <thead><tr><th>Title</th><th>Pri</th><th>Minutes</th><th></th></tr></thead>
          <tbody>
            ${items.map((it) => `
              <tr data-id="${escapeAttr(it.id)}">
                <td><strong>${escapeHtml(it.title)}</strong>
                  <div class="path">${escapeHtml(it.kind)} · ${escapeHtml(it.id)}</div>
                </td>
                <td><input type="number" class="edit-priority" min="0" max="20" value="${Number(it.priority)||0}" style="width:4rem" /></td>
                <td><input type="number" class="edit-minutes" min="0" step="5" value="${Number(it.minutes)||0}" style="width:5rem" /></td>
                <td class="actions">
                  <button type="button" class="btn-save">Save</button>
                  <button type="button" class="btn-remove danger">Remove</button>
                </td>
              </tr>`).join("")}
          </tbody>
        </table>`;
      wrap.querySelectorAll("tr[data-id]").forEach((row) => {
        const id = row.getAttribute("data-id");
        row.querySelector(".btn-save").addEventListener("click", async () => {
          try {
            const next = await api("/api/set", {
              method: "POST",
              body: JSON.stringify({
                key: id,
                priority: Number(row.querySelector(".edit-priority").value),
                minutes: Number(row.querySelector(".edit-minutes").value),
              }),
            });
            msg(`Updated ${id}`, "ok");
            render(next);
          } catch (e) {
            msg(String(e.message || e), "error");
          }
        });
        row.querySelector(".btn-remove").addEventListener("click", async () => {
          if (!confirm(`Remove “${id}”?`)) return;
          try {
            const next = await api("/api/remove", {
              method: "POST",
              body: JSON.stringify({ key: id }),
            });
            msg(`Removed ${id}`, "ok");
            render(next);
          } catch (e) {
            msg(String(e.message || e), "error");
          }
        });
      });
    }

    function render(state) {
      $("data-path").textContent = state.path ? `data: ${state.path}` : "";
      renderPlan(state.plan);
      renderKpis(state);
      renderItems(state);
    }

    async function refresh() {
      try {
        const state = await api("/api/state");
        render(state);
        msg("");
      } catch (e) {
        msg(String(e.message || e), "error");
      }
    }

    $("btn-refresh").addEventListener("click", refresh);
    $("btn-plan").addEventListener("click", async () => {
      try {
        const state = await api("/api/plan", { method: "POST", body: JSON.stringify({ apply: true }) });
        msg("Rebuilt rolling 24h plan", "ok");
        render(state);
      } catch (e) {
        msg(String(e.message || e), "error");
      }
    });
    $("btn-seed").addEventListener("click", async () => {
      if (!confirm("Replace targets with personal starter (sleep, Duchess, workout, Lyft) and clear ad-hoc items?")) return;
      try {
        const state = await api("/api/seed", { method: "POST", body: "{}" });
        msg("Personal targets loaded + plan built", "ok");
        render(state);
      } catch (e) {
        msg(String(e.message || e), "error");
      }
    });
    $("add-form").addEventListener("submit", async (ev) => {
      ev.preventDefault();
      const title = $("add-title").value.trim();
      if (!title) return;
      try {
        const state = await api("/api/add", {
          method: "POST",
          body: JSON.stringify({
            title,
            kind: $("add-kind").value,
            priority: Number($("add-priority").value),
            minutes: Number($("add-minutes").value),
          }),
        });
        $("add-title").value = "";
        msg(`Added “${title}”`, "ok");
        render(state);
      } catch (e) {
        msg(String(e.message || e), "error");
      }
    });
    $("log-form").addEventListener("submit", async (ev) => {
      ev.preventDefault();
      try {
        const body = {
          target_id: $("log-target").value,
          value: Number($("log-value").value),
          note: $("log-note").value,
        };
        if ($("log-date").value) body.date = $("log-date").value;
        const state = await api("/api/log", { method: "POST", body: JSON.stringify(body) });
        msg("Logged", "ok");
        render(state);
      } catch (e) {
        msg(String(e.message || e), "error");
      }
    });

    // default log date = today local
    const d = new Date();
    $("log-date").value = d.toISOString().slice(0, 10);
    refresh();
  </script>
</body>
</html>
